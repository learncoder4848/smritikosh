<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="One repository, many repositories, documents and Slack all feed into Smritikosh, a single local index that splits every source into complete, findable pieces and searches them both by meaning and by exact words. It hands a coding agent a handful of exact ranges -- from either repository, from a document, or from a Slack thread -- instead of the whole corpus, and only re-reads what changed. Keywords: semantic code search, hybrid retrieval, local-first RAG, agent context, incremental indexing, exact citations.">
  <title>Smritikosh: your sources become one local index, and your agent reads only the lines that answer the question</title>

  <defs>
    <!-- light palette, tuned for white GitHub READMEs
         ink #0F172A / muted #64748B / faint #94A3B8 / hairline #E7EAF0 / panel #F7F9FC
         blue #2563EB (meaning) / amber #B45309 (exact words) / emerald #059669 (answer) / rose #E11D48 (changes) -->

    <marker id="sk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>

    <radialGradient id="sk-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.07"/>
      <stop offset="68%" stop-color="#2563EB" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sk-sweepg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="sk-gridclip"><rect x="388" y="78" width="204" height="57" rx="3"/></clipPath>

    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cap{font-size:10px;letter-spacing:.2em;font-weight:700}
      .ink{fill:#0F172A}
      .mut{fill:#64748B}
      .faint{fill:#94A3B8}

      .feed  { animation: sk-dash 2.6s linear infinite; }
      .out   { animation: sk-dash 1.7s linear infinite; }
      @keyframes sk-dash { to { stroke-dashoffset:-22 } }

      .dtile { animation: sk-dtile 2.4s ease-in-out infinite; }
      @keyframes sk-dtile { 0%,100% { opacity:1 } 50% { opacity:.4 } }

      .sweep { animation: sk-sweep 3.4s cubic-bezier(.45,0,.55,1) infinite; }
      @keyframes sk-sweep { from { transform:translateX(0) } to { transform:translateX(296px) } }

      .ev    { animation: sk-ev 7.2s ease-out infinite; }
      @keyframes sk-ev {
        0%       { opacity:0; transform:translateX(-7px) }
        7%, 96%  { opacity:1; transform:translateX(0) }
        100%     { opacity:0; transform:translateX(-7px) }
      }

      .blink { animation: sk-blink 4.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes sk-blink { 0%,90%,100% { transform:scaleY(1) } 94% { transform:scaleY(.12) } }

      @media (prefers-reduced-motion: reduce) {
        .feed,.out,.dtile,.sweep,.ev,.blink { animation:none }
        .ev { opacity:1 }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="299" rx="18" fill="#FFFFFF" stroke="#E7EAF0"/>

  <g class="mono cap">
    <text x="40"  y="30" fill="#64748B">WHAT YOU HAVE</text>
    <text x="490" y="30" fill="#2563EB" text-anchor="middle">ONE LOCAL INDEX</text>
    <text x="920" y="30" fill="#059669" text-anchor="end">WHAT THE AGENT READS</text>
  </g>

  <!-- ===================== LEFT: the sources ===================== -->

  <!-- one repository -->
  <g>
    <rect x="40" y="52" width="248" height="40" rx="10" fill="#F7F9FC"/>
    <g transform="translate(64,73)">
      <rect x="-9" y="-9" width="8" height="4" rx="1.5" fill="#6FA5FF"/>
      <rect x="-9" y="-6" width="18" height="13" rx="2.5" fill="#BBD4FF"/>
    </g>
    <text class="sans ink" x="88" y="77" font-size="12.5" font-weight="600">One repository</text>
  </g>

  <!-- many repositories -->
  <g>
    <rect x="40" y="100" width="248" height="40" rx="10" fill="#F7F9FC"/>
    <g transform="translate(64,121)">
      <rect x="-9" y="-9" width="14" height="9" rx="2" fill="#E3EDFF"/>
      <rect x="-6" y="-5" width="14" height="9" rx="2" fill="#BBD4FF"/>
      <rect x="-3" y="-1" width="14" height="9" rx="2" fill="#6FA5FF"/>
    </g>
    <text class="sans ink" x="88" y="125" font-size="12.5" font-weight="600">Many repositories</text>
  </g>

  <!-- documents -->
  <g>
    <rect x="40" y="148" width="248" height="40" rx="10" fill="#F7F9FC"/>
    <g transform="translate(64,169)">
      <rect x="-6.5" y="-9" width="13" height="17" rx="2" fill="#FFFFFF" stroke="#A8B4C6" stroke-width="1.1"/>
      <g stroke="#A8B4C6" stroke-width="1.1" stroke-linecap="round">
        <line x1="-3.5" y1="-4" x2="3.5" y2="-4"/>
        <line x1="-3.5" y1="0"  x2="3.5" y2="0"/>
        <line x1="-3.5" y1="4"  x2="1"   y2="4"/>
      </g>
    </g>
    <text class="sans ink" x="88" y="173" font-size="12.5" font-weight="600">Documents<tspan class="faint" font-weight="400">&#160; md, docx</tspan></text>
  </g>

  <!-- slack -->
  <g>
    <rect x="40" y="196" width="248" height="40" rx="10" fill="#F7F9FC"/>
    <g transform="translate(64,217)">
      <rect x="-2"   y="-9.5" width="4" height="7" rx="2" fill="#2EB67D"/>
      <rect x="2.5"  y="-2"   width="7" height="4" rx="2" fill="#36C5F0"/>
      <rect x="-2"   y="2.5"  width="4" height="7" rx="2" fill="#ECB22E"/>
      <rect x="-9.5" y="-2"   width="7" height="4" rx="2" fill="#E01E5A"/>
    </g>
    <text class="sans ink" x="88" y="221" font-size="12.5" font-weight="600">Slack<tspan class="faint" font-weight="400">&#160; threads</tspan></text>
    <rect x="244" y="208.5" width="32" height="15" rx="7.5" fill="none" stroke="#D7DEE8"/>
    <text class="mono faint" x="260" y="219" font-size="8" text-anchor="middle">soon</text>
  </g>

  <text class="mono faint" x="40" y="264" font-size="9.5">point it at whatever the agent should know</text>

  <!-- ===================== sources into the index ===================== -->
  <g class="feed" fill="none" stroke="#B9C6D8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7">
    <path d="M288 72  C 320 72,  336 122, 366 138"/>
    <path d="M288 120 C 316 120, 336 132, 364 142" style="animation-delay:.5s"/>
    <path d="M288 168 C 316 168, 336 156, 364 146" style="animation-delay:1s"/>
    <path d="M288 216 C 320 216, 336 166, 366 150" style="animation-delay:1.5s"/>
  </g>

  <!-- ===================== CENTER: the index ===================== -->
  <circle cx="490" cy="144" r="148" fill="url(#sk-halo)"/>
  <rect x="372.5" y="52.5" width="235" height="183" rx="14" fill="#FFFFFF" stroke="#E0E5EE"/>

  <!-- chunk matrix: three pieces pulse as the part that changed -->
  <g fill="#DBEAFE">
    <rect x="392" y="84"  width="20" height="11" rx="2.5"/>
    <rect x="417" y="84"  width="20" height="11" rx="2.5"/>
    <rect x="442" y="84"  width="20" height="11" rx="2.5"/>
    <rect x="467" y="84"  width="20" height="11" rx="2.5"/>
    <rect x="492" y="84"  width="20" height="11" rx="2.5"/>
    <rect x="517" y="84"  width="20" height="11" rx="2.5"/>
    <rect x="542" y="84"  width="20" height="11" rx="2.5"/>
    <rect x="567" y="84"  width="20" height="11" rx="2.5"/>

    <rect x="392" y="102" width="20" height="11" rx="2.5"/>
    <rect x="417" y="102" width="20" height="11" rx="2.5"/>
    <rect class="dtile" fill="#FDA4AF" x="442" y="102" width="20" height="11" rx="2.5"/>
    <rect class="dtile" fill="#FDA4AF" x="467" y="102" width="20" height="11" rx="2.5" style="animation-delay:.3s"/>
    <rect x="492" y="102" width="20" height="11" rx="2.5"/>
    <rect x="517" y="102" width="20" height="11" rx="2.5"/>
    <rect x="542" y="102" width="20" height="11" rx="2.5"/>
    <rect x="567" y="102" width="20" height="11" rx="2.5"/>

    <rect x="392" y="120" width="20" height="11" rx="2.5"/>
    <rect x="417" y="120" width="20" height="11" rx="2.5"/>
    <rect x="442" y="120" width="20" height="11" rx="2.5"/>
    <rect x="467" y="120" width="20" height="11" rx="2.5"/>
    <rect x="492" y="120" width="20" height="11" rx="2.5"/>
    <rect class="dtile" fill="#FDA4AF" x="517" y="120" width="20" height="11" rx="2.5" style="animation-delay:.6s"/>
    <rect x="542" y="120" width="20" height="11" rx="2.5"/>
    <rect x="567" y="120" width="20" height="11" rx="2.5"/>
  </g>

  <g clip-path="url(#sk-gridclip)">
    <rect class="sweep" x="318" y="78" width="70" height="57" fill="url(#sk-sweepg)"/>
  </g>

  <text class="sans mut" x="392" y="150" font-size="10">split into complete, findable pieces</text>
  <line x1="392" y1="163" x2="588" y2="163" stroke="#EEF1F6" stroke-width="1"/>

  <circle cx="396" cy="183" r="3.5" fill="#2563EB"/>
  <text class="sans ink" x="408" y="187" font-size="11">finds by meaning</text>

  <circle cx="396" cy="209" r="3.5" fill="#B45309"/>
  <text class="sans ink" x="408" y="213" font-size="11">finds by exact words</text>

  <!-- only-the-changes badge, straddling the top edge of the card -->
  <rect x="464" y="42" width="124" height="21" rx="10.5" fill="#FFF1F3" stroke="#FBCFD8"/>
  <text class="mono" x="526" y="56" font-size="8" font-weight="700" letter-spacing=".08em" fill="#E11D48" text-anchor="middle">&#916; ONLY WHAT CHANGED</text>

  <text class="sans" x="490" y="266" font-size="22" font-weight="700" letter-spacing="-0.015em" fill="#0F172A" text-anchor="middle">smritikosh</text>
  <text class="mono cap" x="490" y="286" font-size="9.5" fill="#2563EB" text-anchor="middle">NO CLOUD &#183; NO API KEY</text>

  <!-- ===================== index into the agent ===================== -->
  <path class="out" d="M608 144 H 666" fill="none" stroke="#059669" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#sk-arrow)"/>

  <!-- ===================== RIGHT: what comes back ===================== -->
  <rect x="672.5" y="52.5" width="247" height="183" rx="14" fill="#F7F9FC" stroke="#EDF0F5"/>

  <g class="ev">
    <rect x="688" y="71" width="3" height="14" rx="1.5" fill="#059669"/>
    <text class="mono ink" x="700" y="82" font-size="10.5">auth-svc/src/policy.py:176-193</text>
  </g>
  <g class="ev" style="animation-delay:.25s">
    <rect x="688" y="101" width="3" height="14" rx="1.5" fill="#059669"/>
    <text class="mono ink" x="700" y="112" font-size="10.5">billing-svc/src/ledger.py:59-81</text>
  </g>
  <g class="ev" style="animation-delay:.5s">
    <rect x="688" y="131" width="3" height="14" rx="1.5" fill="#059669"/>
    <text class="mono ink" x="700" y="142" font-size="10.5">docs/authorization.md:14-38</text>
  </g>
  <g class="ev" style="animation-delay:.75s">
    <rect x="688" y="161" width="3" height="14" rx="1.5" fill="#059669"/>
    <text class="mono ink" x="700" y="172" font-size="10.5">slack/#platform-oncall:41-58</text>
  </g>

  <line x1="688" y1="194" x2="904" y2="194" stroke="#E4E9F0" stroke-width="1"/>

  <g transform="translate(688,205)">
    <line x1="9" y1="-4" x2="9" y2="0" stroke="#0F172A" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="9" cy="-6" r="1.8" fill="#059669"/>
    <rect x="0" y="0" width="18" height="15" rx="5" fill="#0F172A"/>
    <g fill="#6EE7B7" class="blink">
      <circle cx="6" cy="7" r="1.7"/>
      <circle cx="12" cy="7" r="1.7"/>
    </g>
  </g>
  <text class="sans ink" x="714" y="217" font-size="11">only the passages that answer it</text>

  <text class="mono faint" x="920" y="264" font-size="9.5" text-anchor="end">every answer cites its source</text>
</svg>
