<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" width="960" height="264" role="img" aria-label="Why an index has to keep up. Before: in the file policy.py, the login check sits at lines 176 to 193. Then someone adds two new lines near the top of that file, and everything below them moves down, so the login check now sits at lines 178 to 195. An index that was not updated still answers lines 176 to 193: that answer is instant, it is two lines too high, and it quotes the wrong code. Smritikosh notices the file changed, reads that one file again in 3 seconds, and answers lines 178 to 195. Leave smritikosh index with the watch flag running and it keeps up on every save; re-reading all 59 files in the project instead would take 40 seconds. Keywords: stale index, line numbers moved, exact citations, incremental update, watch mode, always fresh.">
  <title>When code moves, an out-of-date index quietly points at the wrong lines</title>

  <defs>
    <marker id="pl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>

    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cap{font-size:10px;letter-spacing:.2em;font-weight:700}
      .ink{fill:#0F172A}
      .mut{fill:#64748B}
      .faint{fill:#94A3B8}

      .drop { animation: pl-drop 4.4s ease-in-out infinite; }
      @keyframes pl-drop { 0%,20% { transform:translateY(-24px) } 38%,100% { transform:translateY(0) } }

      .show { animation: pl-show 4.4s ease-in-out infinite; }
      @keyframes pl-show { 0%,22% { opacity:0 } 42%,100% { opacity:1 } }

      .late { animation: pl-late 4.4s ease-in-out infinite; }
      @keyframes pl-late { 0%,48% { opacity:.25 } 60%,100% { opacity:1 } }

      .type { animation: pl-type 1.1s steps(1,end) infinite; }
      @keyframes pl-type { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }

      @media (prefers-reduced-motion: reduce) {
        .drop,.show,.late,.type { animation:none; opacity:1; transform:none }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="263" rx="18" fill="#FFFFFF" stroke="#C3CCD9"/>

  <g class="mono cap">
    <text x="32"  y="24" fill="#64748B">THIS MORNING</text>
    <text x="306" y="24" fill="#E11D48">SOMEONE ADDS TWO LINES</text>
    <text x="612" y="24" fill="#64748B">WHAT YOUR AGENT IS TOLD</text>
  </g>

  <!-- ============ the file, before ============ -->
  <rect x="32.5" y="34.5" width="249" height="170" rx="12" fill="#FDFDFD" stroke="#BDC7D7"/>
  <text class="mono" x="48" y="56" font-size="10" fill="#334155">policy.py</text>
  <line x1="48" y1="64" x2="266" y2="64" stroke="#E2E8F0"/>
  <g fill="#D7DEE8">
    <rect x="48" y="76" width="150" height="6" rx="3"/>
    <rect x="48" y="90" width="112" height="6" rx="3"/>
  </g>
  <rect x="48.5" y="106.5" width="216" height="66" rx="9" fill="#F1FAF6" stroke="#BFE3D3"/>
  <text class="sans ink" x="66" y="132" font-size="11.5">the login check</text>
  <text class="mono" x="66" y="156" font-size="11" fill="#047857">lines 176&#8211;193</text>

  <text class="sans faint" x="292" y="124" font-size="14">&#8250;</text>

  <!-- ============ the file, after ============ -->
  <rect x="306.5" y="34.5" width="249" height="170" rx="12" fill="#FDFDFD" stroke="#BDC7D7"/>
  <text class="mono" x="322" y="56" font-size="10" fill="#334155">policy.py</text>
  <line x1="322" y1="64" x2="540" y2="64" stroke="#E2E8F0"/>

  <rect x="322.5" y="70.5" width="216" height="20" rx="6" fill="#FFE4E6" stroke="#F2C9CF"/>
  <text class="sans" x="334" y="84" font-size="9.5" fill="#BE123C">2 new lines added up here</text>

  <g class="drop">
    <g fill="#D7DEE8">
      <rect x="322" y="100" width="150" height="6" rx="3"/>
      <rect x="322" y="114" width="112" height="6" rx="3"/>
    </g>
    <rect x="322.5" y="128.5" width="216" height="66" rx="9" fill="#F1FAF6" stroke="#BFE3D3"/>
    <text class="sans ink" x="340" y="154" font-size="11.5">the login check</text>
    <text class="mono" x="340" y="178" font-size="11" fill="#047857">lines 178&#8211;195</text>
  </g>

  <path d="M566 119 H 600" fill="none" stroke="#94A3B8" stroke-width="1.4"
        stroke-linecap="round" marker-end="url(#pl-arrow)"/>

  <!-- ============ the two answers ============ -->
  <rect x="612.5" y="34.5" width="315" height="82" rx="12" fill="#FEF2F3" stroke="#F2C9CF"/>
  <circle cx="630" cy="56" r="4" fill="#E11D48"/>
  <text class="sans ink" x="644" y="60" font-size="12.5" font-weight="600">An index left out of date</text>
  <text class="mono" x="908" y="60" font-size="11" font-weight="700" fill="#E11D48" text-anchor="end">instant</text>
  <g class="late">
    <rect x="628.5" y="70.5" width="180" height="24" rx="7" fill="#FDFDFD" stroke="#F2C9CF"/>
    <text class="mono" x="640" y="86" font-size="9.5" fill="#334155">policy.py</text>
    <text class="mono" x="798" y="86" font-size="9.5" fill="#E11D48" text-anchor="end">lines 176&#8211;193</text>
    <text class="mono" x="820" y="87" font-size="12" fill="#E11D48">&#10007;</text>
  </g>
  <text class="sans mut" x="628" y="110" font-size="10">Two lines too high. It quotes the wrong code, confidently.</text>

  <rect x="612.5" y="122.5" width="315" height="82" rx="12" fill="#F1FAF6" stroke="#BFE3D3"/>
  <circle cx="630" cy="144" r="4" fill="#059669"/>
  <text class="sans ink" x="644" y="148" font-size="12.5" font-weight="600">Smritikosh</text>
  <text class="mono" x="908" y="148" font-size="11" font-weight="700" fill="#059669" text-anchor="end">3 seconds</text>
  <g class="show">
    <rect x="628.5" y="158.5" width="180" height="24" rx="7" fill="#FDFDFD" stroke="#BFE3D3"/>
    <text class="mono" x="640" y="174" font-size="9.5" fill="#334155">policy.py</text>
    <text class="mono" x="798" y="174" font-size="9.5" fill="#047857" text-anchor="end">lines 178&#8211;195</text>
    <text class="mono" x="820" y="175" font-size="12" fill="#059669">&#10003;</text>
  </g>
  <text class="sans mut" x="628" y="198" font-size="10">It saw the file change and read that one file again.</text>

  <!-- ============ leave it running ============ -->
  <rect x="32.5" y="215.5" width="230" height="26" rx="8" fill="#F7F9FC" stroke="#D3DBE6"/>
  <text class="mono ink" x="46" y="232" font-size="10.5">smritikosh index . --watch<tspan class="type" fill="#2563EB">_</tspan></text>
  <text class="sans mut" x="278" y="232" font-size="10.5">leave it running and it keeps up on every save</text>
  <text class="sans faint" x="928" y="232" font-size="9.5" text-anchor="end">re-reading all 59 files instead: 40 seconds</text>
</svg>
