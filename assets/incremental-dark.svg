<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" width="960" height="264" role="img" aria-label="A grid of 72 files after a re-index. Three of them changed and are read again; the other 69 are recognised as unchanged and skipped instantly, with their existing vectors reused. Keywords: incremental indexing, delta processing, SHA-256 file skipping, chunk memoization, watch mode.">
  <title>Re-indexing: only the files that changed are read again</title>

  <defs>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cap{font-size:10px;letter-spacing:.2em;font-weight:700}
      .ink{fill:#E6EAF2}
      .mut{fill:#9AA4BA}
      .faint{fill:#77839C}

      .changed { animation: sk-changed 2.2s ease-in-out infinite; }
      @keyframes sk-changed { 0%,100% { opacity:1 } 50% { opacity:.38 } }

      .type { animation: sk-type 5s steps(1,end) infinite; }
      @keyframes sk-type { 0%,48% { opacity:1 } 50%,98% { opacity:0 } 100% { opacity:1 } }

      @media (prefers-reduced-motion: reduce) {
        .changed,.type { animation:none }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="263" rx="18" fill="#0B1020" stroke="#26304A"/>

  <text class="mono cap" x="32" y="32" fill="#9AA4BA">EVERY RUN AFTER THE FIRST</text>
  <text class="sans ink" x="32" y="62" font-size="14.5">Three files changed. Only those three are read again.</text>
  <text class="mono" x="928" y="62" font-size="11" fill="#FB7185" text-anchor="end">3 of 72</text>

  <!-- the corpus: one tile per file, three of them pulsing as the part that changed -->
  <g fill="#25406E">
    <rect x="32"  y="88" width="42" height="18" rx="3"/>
    <rect x="82"  y="88" width="42" height="18" rx="3"/>
    <rect x="132" y="88" width="42" height="18" rx="3"/>
    <rect x="182" y="88" width="42" height="18" rx="3"/>
    <rect x="232" y="88" width="42" height="18" rx="3"/>
    <rect x="282" y="88" width="42" height="18" rx="3"/>
    <rect x="332" y="88" width="42" height="18" rx="3"/>
    <rect x="382" y="88" width="42" height="18" rx="3"/>
    <rect x="432" y="88" width="42" height="18" rx="3"/>
    <rect x="482" y="88" width="42" height="18" rx="3"/>
    <rect x="532" y="88" width="42" height="18" rx="3"/>
    <rect x="582" y="88" width="42" height="18" rx="3"/>
    <rect x="632" y="88" width="42" height="18" rx="3"/>
    <rect x="682" y="88" width="42" height="18" rx="3"/>
    <rect x="732" y="88" width="42" height="18" rx="3"/>
    <rect x="782" y="88" width="42" height="18" rx="3"/>
    <rect x="832" y="88" width="42" height="18" rx="3"/>
    <rect x="882" y="88" width="42" height="18" rx="3"/>

    <rect x="32"  y="114" width="42" height="18" rx="3"/>
    <rect x="82"  y="114" width="42" height="18" rx="3"/>
    <rect class="changed" fill="#9F1239" x="132" y="114" width="42" height="18" rx="3"/>
    <rect x="182" y="114" width="42" height="18" rx="3"/>
    <rect x="232" y="114" width="42" height="18" rx="3"/>
    <rect x="282" y="114" width="42" height="18" rx="3"/>
    <rect x="332" y="114" width="42" height="18" rx="3"/>
    <rect x="382" y="114" width="42" height="18" rx="3"/>
    <rect x="432" y="114" width="42" height="18" rx="3"/>
    <rect x="482" y="114" width="42" height="18" rx="3"/>
    <rect x="532" y="114" width="42" height="18" rx="3"/>
    <rect x="582" y="114" width="42" height="18" rx="3"/>
    <rect x="632" y="114" width="42" height="18" rx="3"/>
    <rect x="682" y="114" width="42" height="18" rx="3"/>
    <rect x="732" y="114" width="42" height="18" rx="3"/>
    <rect x="782" y="114" width="42" height="18" rx="3"/>
    <rect x="832" y="114" width="42" height="18" rx="3"/>
    <rect x="882" y="114" width="42" height="18" rx="3"/>

    <rect x="32"  y="140" width="42" height="18" rx="3"/>
    <rect x="82"  y="140" width="42" height="18" rx="3"/>
    <rect x="132" y="140" width="42" height="18" rx="3"/>
    <rect x="182" y="140" width="42" height="18" rx="3"/>
    <rect x="232" y="140" width="42" height="18" rx="3"/>
    <rect x="282" y="140" width="42" height="18" rx="3"/>
    <rect class="changed" fill="#9F1239" x="332" y="140" width="42" height="18" rx="3" style="animation-delay:.45s"/>
    <rect x="382" y="140" width="42" height="18" rx="3"/>
    <rect x="432" y="140" width="42" height="18" rx="3"/>
    <rect x="482" y="140" width="42" height="18" rx="3"/>
    <rect x="532" y="140" width="42" height="18" rx="3"/>
    <rect x="582" y="140" width="42" height="18" rx="3"/>
    <rect x="632" y="140" width="42" height="18" rx="3"/>
    <rect x="682" y="140" width="42" height="18" rx="3"/>
    <rect x="732" y="140" width="42" height="18" rx="3"/>
    <rect x="782" y="140" width="42" height="18" rx="3"/>
    <rect x="832" y="140" width="42" height="18" rx="3"/>
    <rect x="882" y="140" width="42" height="18" rx="3"/>

    <rect x="32"  y="166" width="42" height="18" rx="3"/>
    <rect x="82"  y="166" width="42" height="18" rx="3"/>
    <rect x="132" y="166" width="42" height="18" rx="3"/>
    <rect x="182" y="166" width="42" height="18" rx="3"/>
    <rect x="232" y="166" width="42" height="18" rx="3"/>
    <rect x="282" y="166" width="42" height="18" rx="3"/>
    <rect x="332" y="166" width="42" height="18" rx="3"/>
    <rect x="382" y="166" width="42" height="18" rx="3"/>
    <rect x="432" y="166" width="42" height="18" rx="3"/>
    <rect x="482" y="166" width="42" height="18" rx="3"/>
    <rect x="532" y="166" width="42" height="18" rx="3"/>
    <rect class="changed" fill="#9F1239" x="582" y="166" width="42" height="18" rx="3" style="animation-delay:.9s"/>
    <rect x="632" y="166" width="42" height="18" rx="3"/>
    <rect x="682" y="166" width="42" height="18" rx="3"/>
    <rect x="732" y="166" width="42" height="18" rx="3"/>
    <rect x="782" y="166" width="42" height="18" rx="3"/>
    <rect x="832" y="166" width="42" height="18" rx="3"/>
    <rect x="882" y="166" width="42" height="18" rx="3"/>
  </g>

  <rect x="32" y="205" width="12" height="12" rx="3" fill="#25406E"/>
  <text class="sans mut" x="52" y="215" font-size="11">recognised as unchanged, skipped instantly</text>

  <rect x="300" y="205" width="12" height="12" rx="3" fill="#9F1239"/>
  <text class="sans mut" x="320" y="215" font-size="11">changed, read and re-embedded</text>

  <rect x="608" y="198" width="320" height="26" rx="8" fill="#131A2E"/>
  <text class="mono ink" x="622" y="215" font-size="11">smritikosh index . --watch<tspan class="type" fill="#4C8DFF">_</tspan></text>
  <text class="sans faint" x="608" y="242" font-size="10">leave it running and the index never goes stale</text>
</svg>
