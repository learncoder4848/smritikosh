<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Git repositories, whether one monorepo or many, plus documents and Slack, stay live as they change, with more sources you can ask for on the way. Smritikosh keeps them in sync incrementally, re-reading only the delta, and hands a coding agent a handful of exact source ranges that never go stale. Keywords: incremental sync, semantic code search, hybrid retrieval, agent context, always-fresh index, exact citations, local-first.">
  <title>Smritikosh keeps your sources in sync incrementally so your agent is never working from stale context</title>

  <defs>
    <!-- light palette, dark twin of hero-light.svg
         ink #E6EAF2 / muted #9AA4BA / faint #77839C / hairline #E7EAF0 / panel #131A2E
         blue #4C8DFF (engine) / emerald #34D399 (agent, liveness) / rose #FB7185 (the delta) -->

    <marker id="sk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#34D399"/>
    </marker>

    <radialGradient id="sk-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4C8DFF" stop-opacity="0.07"/>
      <stop offset="68%" stop-color="#4C8DFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#4C8DFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sk-sweepg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4C8DFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="sk-gridclip"><rect x="346" y="82" width="196" height="57" rx="3"/></clipPath>

    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cap{font-size:10px;letter-spacing:.2em;font-weight:700}
      .ink{fill:#E6EAF2}
      .mut{fill:#9AA4BA}
      .faint{fill:#77839C}

      .feed  { animation: sk-dash 2.6s linear infinite; }
      .out   { animation: sk-dash 1.7s linear infinite; }
      @keyframes sk-dash { to { stroke-dashoffset:-22 } }

      .live  { animation: sk-live 2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes sk-live { 0%,100% { opacity:1 } 50% { opacity:.35 } }

      .dtile { animation: sk-dtile 2.4s ease-in-out infinite; }
      @keyframes sk-dtile { 0%,100% { opacity:1 } 50% { opacity:.4 } }

      .sweep { animation: sk-sweep 3.4s cubic-bezier(.45,0,.55,1) infinite; }
      @keyframes sk-sweep { from { transform:translateX(0) } to { transform:translateX(288px) } }

      .beat  { animation: sk-beat 1.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes sk-beat { 0%,100% { transform:scale(1) } 50% { transform:scale(1.35) } }

      .blink { animation: sk-blink 4.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes sk-blink { 0%,88%,100% { transform:scaleY(1) } 92% { transform:scaleY(.12) } }

      .ev    { animation: sk-ev 7.2s ease-out infinite; }
      @keyframes sk-ev {
        0%       { opacity:0; transform:translateX(-7px) }
        7%, 96%  { opacity:1; transform:translateX(0) }
        100%     { opacity:0; transform:translateX(-7px) }
      }

      @media (prefers-reduced-motion: reduce) {
        .feed,.out,.live,.dtile,.sweep,.beat,.blink,.ev { animation:none }
        .ev { opacity:1 }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="299" rx="18" fill="#0B1020" stroke="#26304A"/>

  <g class="mono cap">
    <text x="32"  y="30" fill="#9AA4BA">SOURCES &#183; LIVE</text>
    <text x="444" y="30" fill="#4C8DFF" text-anchor="middle">INCREMENTAL &#183; SYNC</text>
    <text x="928" y="30" fill="#34D399" text-anchor="end">AGENT &#183; NEVER STALE</text>
  </g>

  <!-- ===================== LEFT: sources, each one live ===================== -->

  <g>
    <rect x="32" y="52" width="240" height="40" rx="10" fill="#131A2E"/>
    <g transform="translate(56,73)">
      <g fill="none" stroke="#4C8DFF" stroke-width="1.7" stroke-linecap="round">
        <path d="M-4.5 -6.6 V 2.3"/>
        <path d="M4.5 -2.2 A 6.75 6.75 0 0 1 -2.2 4.5"/>
      </g>
      <circle cx="4.5" cy="-4.6" r="2.5" fill="#4C8DFF"/>
      <circle cx="-4.5" cy="4.6" r="2.5" fill="#2D4C7E" stroke="#4C8DFF" stroke-width="1.1"/>
    </g>
    <text class="sans ink" x="80" y="77" font-size="12.5" font-weight="600">Git repos<tspan class="faint" font-weight="400">&#160; mono, multi</tspan></text>
    <circle class="live" cx="252" cy="72" r="4" fill="#34D399"/>
  </g>

  <g>
    <rect x="32" y="100" width="240" height="40" rx="10" fill="#131A2E"/>
    <g transform="translate(56,121)">
      <rect x="-6.5" y="-9" width="13" height="17" rx="2" fill="#131A2E" stroke="#7A879E" stroke-width="1.1"/>
      <g stroke="#7A879E" stroke-width="1.1" stroke-linecap="round">
        <line x1="-3.5" y1="-4" x2="3.5" y2="-4"/>
        <line x1="-3.5" y1="0"  x2="3.5" y2="0"/>
        <line x1="-3.5" y1="4"  x2="1"   y2="4"/>
      </g>
    </g>
    <text class="sans ink" x="80" y="125" font-size="12.5" font-weight="600">Documents<tspan class="faint" font-weight="400">&#160; md, docx</tspan></text>
    <circle class="live" cx="252" cy="120" r="4" fill="#34D399" style="animation-delay:0.5s"/>
  </g>

  <g>
    <rect x="32" y="148" width="240" height="40" rx="10" fill="#131A2E"/>
    <g transform="translate(56,169)">
      <rect x="-2"   y="-9.5" width="4" height="7" rx="2" fill="#2EB67D"/>
      <rect x="2.5"  y="-2"   width="7" height="4" rx="2" fill="#36C5F0"/>
      <rect x="-2"   y="2.5"  width="4" height="7" rx="2" fill="#ECB22E"/>
      <rect x="-9.5" y="-2"   width="7" height="4" rx="2" fill="#E01E5A"/>
    </g>
    <text class="sans ink" x="80" y="173" font-size="12.5" font-weight="600">Slack<tspan class="faint" font-weight="400">&#160; threads</tspan></text>
    <rect x="216" y="160.5" width="36" height="15" rx="7.5" fill="none" stroke="#33405C"/>
    <text class="mono faint" x="234" y="171" font-size="8" text-anchor="middle">soon</text>
  </g>

  <g>
    <rect x="32" y="196" width="240" height="40" rx="10" fill="none" stroke="#33405C" stroke-width="1.2" stroke-dasharray="5 4"/>
    <g transform="translate(56,216)" stroke="#7A879E" stroke-width="1.8" stroke-linecap="round"><line x1="-6" y1="0" x2="6" y2="0"/><line x1="0" y1="-6" x2="0" y2="6"/></g>
    <text class="sans mut" x="80" y="221" font-size="12.5" font-weight="600">More sources<tspan class="faint" font-weight="400">&#160; you can ask for</tspan></text>
  </g>

  <text class="mono faint" x="32" y="264" font-size="9.5">they change all day, so does the index</text>

  <!-- ===================== sources into the engine ===================== -->
  <g class="feed" fill="none" stroke="#2E3A57" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7">
    <path d="M272 72  C 300 72, 312 120, 330 138"/>
    <path d="M272 120 C 296 120, 312 134, 328 144" style="animation-delay:.5s"/>
    <path d="M272 168 C 300 168, 312 164, 330 150" style="animation-delay:1s"/>
  </g>

  <!-- ===================== CENTER: the incremental engine ===================== -->
  <circle cx="444" cy="144" r="146" fill="url(#sk-halo)"/>
  <rect x="332.5" y="52.5" width="223" height="183" rx="14" fill="#111A2E" stroke="#2B3653"/>

  <g fill="#25406E">
    <rect x="350" y="88"  width="19" height="11" rx="2.5"/>
    <rect x="374" y="88"  width="19" height="11" rx="2.5"/>
    <rect x="398" y="88"  width="19" height="11" rx="2.5"/>
    <rect x="422" y="88"  width="19" height="11" rx="2.5"/>
    <rect x="446" y="88"  width="19" height="11" rx="2.5"/>
    <rect x="470" y="88"  width="19" height="11" rx="2.5"/>
    <rect x="494" y="88"  width="19" height="11" rx="2.5"/>
    <rect x="518" y="88"  width="19" height="11" rx="2.5"/>

    <rect x="350" y="106" width="19" height="11" rx="2.5"/>
    <rect x="374" y="106" width="19" height="11" rx="2.5"/>
    <rect class="dtile" fill="#9F1239" x="398" y="106" width="19" height="11" rx="2.5"/>
    <rect class="dtile" fill="#9F1239" x="422" y="106" width="19" height="11" rx="2.5" style="animation-delay:.3s"/>
    <rect x="446" y="106" width="19" height="11" rx="2.5"/>
    <rect x="470" y="106" width="19" height="11" rx="2.5"/>
    <rect x="494" y="106" width="19" height="11" rx="2.5"/>
    <rect x="518" y="106" width="19" height="11" rx="2.5"/>

    <rect x="350" y="124" width="19" height="11" rx="2.5"/>
    <rect x="374" y="124" width="19" height="11" rx="2.5"/>
    <rect x="398" y="124" width="19" height="11" rx="2.5"/>
    <rect x="422" y="124" width="19" height="11" rx="2.5"/>
    <rect x="446" y="124" width="19" height="11" rx="2.5"/>
    <rect class="dtile" fill="#9F1239" x="470" y="124" width="19" height="11" rx="2.5" style="animation-delay:.6s"/>
    <rect x="494" y="124" width="19" height="11" rx="2.5"/>
    <rect x="518" y="124" width="19" height="11" rx="2.5"/>
  </g>

  <g clip-path="url(#sk-gridclip)">
    <rect class="sweep" x="276" y="82" width="70" height="57" fill="url(#sk-sweepg)"/>
  </g>

  <text class="sans mut" x="350" y="154" font-size="10">split into complete, findable pieces</text>
  <line x1="350" y1="166" x2="538" y2="166" stroke="#242E48" stroke-width="1"/>

  <circle cx="354" cy="186" r="3.5" fill="#FB7185"/>
  <text class="sans ink" x="366" y="190" font-size="11">re-syncs in seconds</text>

  <circle class="live" cx="354" cy="212" r="3.5" fill="#34D399"/>
  <text class="sans ink" x="366" y="216" font-size="11">stays live as you work</text>

  <rect x="432" y="42" width="124" height="21" rx="10.5" fill="#2A1622" stroke="#7F2338"/>
  <text class="mono" x="494" y="56" font-size="8" font-weight="700" letter-spacing=".08em" fill="#FB7185" text-anchor="middle">&#916; ONLY WHAT CHANGED</text>

  <g transform="translate(362.29,239.67) scale(0.38)">
    <path d="M 13 74 C 25 12 71 12 83 74" fill="none" stroke="#E6EAF2" stroke-width="7" stroke-linecap="round"/>
    <circle cx="13" cy="74" r="8.5" fill="#E6EAF2"/>
    <circle cx="26.58" cy="40.07" r="8.5" fill="#E6EAF2"/>
    <circle cx="69.42" cy="40.07" r="8.5" fill="#E6EAF2"/>
    <circle cx="83" cy="74" r="8.5" fill="#E6EAF2"/>
    <circle cx="48" cy="27.5" r="13.5" fill="#4C8DFF"/>
  </g>
  <text class="sans" x="466" y="266" font-size="22" font-weight="700" letter-spacing="-0.015em" fill="#E6EAF2" text-anchor="middle">smritikosh</text>
  <text class="mono cap" x="444" y="286" font-size="9.5" fill="#4C8DFF" text-anchor="middle">ONLY THE &#916; &#183; NO CLOUD, NO KEY</text>

  <!-- ===================== engine into the agent ===================== -->
  <path class="out" d="M556 144 H 584" fill="none" stroke="#34D399" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#sk-arrow)"/>

  <!-- ===================== RIGHT: the agent, and what it is holding ===================== -->
  <g transform="translate(622,142)">
    <line x1="0" y1="-44" x2="0" y2="-31" stroke="#9AA4BA" stroke-width="2" stroke-linecap="round"/>
    <circle class="beat" cx="0" cy="-47" r="3.6" fill="#34D399"/>
    <rect x="-30" y="-29" width="60" height="51" rx="15" fill="#3A5B96"/>
    <rect x="-22" y="-20" width="44" height="31" rx="9" fill="#0B1020"/>
    <g fill="#34D399" class="blink">
      <circle cx="-9" cy="-7" r="3.3"/>
      <circle cx="9"  cy="-7" r="3.3"/>
    </g>
    <path d="M-7 2 Q 0 8 7 2" stroke="#34D399" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <circle cx="-24" cy="4" r="2.8" fill="#5A8FE0"/>
    <circle cx="24"  cy="4" r="2.8" fill="#5A8FE0"/>
    <rect x="-19" y="26" width="38" height="7" rx="3.5" fill="#3A5B96"/>
  </g>

  <rect x="668.5" y="52.5" width="259" height="183" rx="14" fill="#101728" stroke="#232D46"/>

  <g class="ev">
    <rect x="684" y="71" width="3" height="14" rx="1.5" fill="#34D399"/>
    <text class="mono ink" x="696" y="82" font-size="10.5">auth-svc/src/policy.py:176-193</text>
  </g>
  <g class="ev" style="animation-delay:.25s">
    <rect x="684" y="101" width="3" height="14" rx="1.5" fill="#34D399"/>
    <text class="mono ink" x="696" y="112" font-size="10.5">billing-svc/src/ledger.py:59-81</text>
  </g>
  <g class="ev" style="animation-delay:.5s">
    <rect x="684" y="131" width="3" height="14" rx="1.5" fill="#34D399"/>
    <text class="mono ink" x="696" y="142" font-size="10.5">docs/authorization.md:14-38</text>
  </g>
  <g class="ev" style="animation-delay:.75s">
    <rect x="684" y="161" width="3" height="14" rx="1.5" fill="#34D399"/>
    <text class="mono ink" x="696" y="172" font-size="10.5">slack/#platform-oncall:41-58</text>
  </g>

  <line x1="684" y1="194" x2="912" y2="194" stroke="#242E48" stroke-width="1"/>
  <text class="sans ink" x="684" y="216" font-size="11">exact passages, never a stale line number</text>

  <text class="mono faint" x="928" y="264" font-size="9.5" text-anchor="end">every answer cites its source</text>
</svg>
