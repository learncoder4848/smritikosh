<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Smritikosh parses a repository into definition-aligned chunks, indexes them with dense vectors and BM25 postings, then returns exact source ranges to a coding agent">
  <title>Smritikosh: repository to local index to exact evidence</title>
  <style>
    .s{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .lbl{font-size:10.5px;letter-spacing:.09em;fill:#8C97AE}
    .fg{fill:#E6EAF2}
    .mut{fill:#9AA4BA}
    .panel{fill:#131A2E;stroke:#26304A;stroke-width:1}
    .wire{stroke:#313D5C;stroke-width:1.5;fill:none}
    @keyframes tilein{from{opacity:.14}to{opacity:1}}
    @keyframes flow{0%{opacity:0;transform:translateX(0)}14%{opacity:1}86%{opacity:1}100%{opacity:0;transform:translateX(56px)}}
    @keyframes rowin{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:translateX(0)}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    .tile{fill:#26406E;animation:tilein .9s ease-out both}
    .dot{animation:flow 1.9s linear infinite}
    .ev{animation:rowin .8s ease-out both}
    .delta{animation:pulse 2.2s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.tile,.dot,.ev,.delta{animation:none}}
  </style>

  <rect x="0.5" y="0.5" width="959" height="299" rx="16" fill="#0B1020" stroke="#26304A"/>

  <text class="m fg" x="32" y="46" font-size="19">smritikosh</text>
  <text class="s mut" x="32" y="70" font-size="13">Exact evidence for coding agents &#8212; not a dump of the source tree.</text>
  <text class="s lbl" x="928" y="46" text-anchor="end">LOCAL-FIRST &#183; READ-ONLY &#183; &#916; INCREMENTAL</text>

  <rect class="panel" x="32.5" y="96.5" width="223" height="171" rx="12"/>
  <text class="s lbl" x="48" y="120">REPOSITORY</text>
  <text class="m fg" x="48" y="146" font-size="11">src/auth/policy.py</text>
  <text class="m fg" x="48" y="170" font-size="11">src/auth/permissions.py</text>
  <text class="m fg" x="48" y="194" font-size="11">src/api/routes.ts</text>
  <text class="m fg" x="48" y="218" font-size="11">tests/auth/test_policy.py</text>
  <text class="m mut" x="48" y="242" font-size="11">docs/authz.md</text>
  <g class="delta">
    <rect x="186.5" y="134.5" width="54" height="17" rx="8" fill="#2A1622" stroke="#FB7185"/>
    <text class="s" x="213" y="146.5" font-size="9.5" fill="#FB7185" text-anchor="middle">&#916; edited</text>
  </g>

  <path class="wire" d="M256 182 H304"/>
  <path d="M304 182 l-6 -3.5 v7 z" fill="#313D5C"/>
  <g fill="#4C8DFF">
    <circle class="dot" cx="258" cy="182" r="2.6"/>
    <circle class="dot" cx="258" cy="182" r="2.6" style="animation-delay:.63s"/>
    <circle class="dot" cx="258" cy="182" r="2.6" style="animation-delay:1.26s"/>
  </g>

  <rect class="panel" x="312.5" y="96.5" width="271" height="171" rx="12"/>
  <text class="s lbl" x="328" y="120">INDEX &#8212; ONE DUCKDB FILE</text>
  <g>
    <rect class="tile" x="328" y="138" width="20" height="11" rx="2"/>
    <rect class="tile" x="355" y="138" width="20" height="11" rx="2" style="animation-delay:.07s"/>
    <rect class="tile" x="382" y="138" width="20" height="11" rx="2" style="animation-delay:.14s"/>
    <rect class="tile" x="409" y="138" width="20" height="11" rx="2" style="animation-delay:.21s"/>
    <rect class="tile" x="436" y="138" width="20" height="11" rx="2" style="animation-delay:.28s"/>
    <rect class="tile" x="463" y="138" width="20" height="11" rx="2" style="animation-delay:.35s"/>
    <rect class="tile" x="490" y="138" width="20" height="11" rx="2" style="animation-delay:.42s"/>
    <rect class="tile" x="517" y="138" width="20" height="11" rx="2" style="animation-delay:.49s"/>

    <rect class="tile" x="328" y="156" width="20" height="11" rx="2" style="animation-delay:.1s"/>
    <rect class="tile" x="355" y="156" width="20" height="11" rx="2" style="animation-delay:.17s"/>
    <rect class="tile" x="382" y="156" width="20" height="11" rx="2" style="animation-delay:.24s"/>
    <rect class="tile" x="409" y="156" width="20" height="11" rx="2" style="animation-delay:.31s"/>
    <rect class="tile" x="436" y="156" width="20" height="11" rx="2" style="animation-delay:.38s"/>
    <rect class="tile" x="463" y="156" width="20" height="11" rx="2" style="animation-delay:.45s"/>
    <rect class="tile" x="490" y="156" width="20" height="11" rx="2" style="animation-delay:.52s"/>
    <rect class="tile" x="517" y="156" width="20" height="11" rx="2" style="animation-delay:.59s"/>

    <rect class="tile" x="328" y="174" width="20" height="11" rx="2" style="animation-delay:.2s"/>
    <rect class="tile" x="355" y="174" width="20" height="11" rx="2" style="animation-delay:.27s"/>
    <rect class="tile" x="382" y="174" width="20" height="11" rx="2" style="animation-delay:.34s"/>
    <rect class="tile" x="409" y="174" width="20" height="11" rx="2" style="animation-delay:.41s"/>
    <rect class="tile" x="436" y="174" width="20" height="11" rx="2" style="animation-delay:.48s"/>
    <rect class="tile" x="463" y="174" width="20" height="11" rx="2" style="animation-delay:.55s"/>
    <rect class="tile" x="490" y="174" width="20" height="11" rx="2" style="animation-delay:.62s"/>
    <rect class="tile" x="517" y="174" width="20" height="11" rx="2" style="animation-delay:.69s"/>
  </g>
  <text class="s mut" x="328" y="204" font-size="10.5">definition-aligned chunks &#183; tree-sitter</text>
  <circle cx="332" cy="226" r="3.5" fill="#4C8DFF"/>
  <text class="s fg" x="344" y="230" font-size="11">dense vectors &#183; CodeRankEmbed, on CPU</text>
  <circle cx="332" cy="250" r="3.5" fill="#FBBF24"/>
  <text class="s fg" x="344" y="254" font-size="11">BM25 postings &#183; incremental</text>

  <path class="wire" d="M584 182 H632"/>
  <path d="M632 182 l-6 -3.5 v7 z" fill="#313D5C"/>
  <g fill="#34D399">
    <circle class="dot" cx="586" cy="182" r="2.6" style="animation-delay:.3s"/>
    <circle class="dot" cx="586" cy="182" r="2.6" style="animation-delay:.93s"/>
    <circle class="dot" cx="586" cy="182" r="2.6" style="animation-delay:1.56s"/>
  </g>

  <rect class="panel" x="640.5" y="96.5" width="287" height="171" rx="12"/>
  <text class="s lbl" x="656" y="120">EVIDENCE RETURNED TO THE AGENT</text>
  <g class="ev">
    <rect x="656" y="138" width="3" height="14" rx="1.5" fill="#4C8DFF"/>
    <text class="m fg" x="668" y="149" font-size="11">src/auth/policy.py:176-193</text>
  </g>
  <g class="ev" style="animation-delay:.28s">
    <rect x="656" y="166" width="3" height="14" rx="1.5" fill="#4C8DFF"/>
    <text class="m fg" x="668" y="177" font-size="11">src/auth/permissions.py:59-81</text>
  </g>
  <g class="ev" style="animation-delay:.56s">
    <rect x="656" y="194" width="3" height="14" rx="1.5" fill="#34D399"/>
    <text class="m fg" x="668" y="205" font-size="11">tests/auth/test_policy.py:14-38</text>
  </g>
  <text class="s mut" x="656" y="232" font-size="10.5">search returns locations &#183; chunks reads the ranges</text>
  <text class="s mut" x="656" y="252" font-size="10.5">no source tree access &#183; no write lock</text>
</svg>
