<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="One question is asked four ways at once. Each angle is searched twice, once for semantic recall using local embeddings and once for lexical precision using a BM25 index. The two rankings are merged with reciprocal rank fusion, every angle is guaranteed a seat, near-duplicates are dropped with maximal marginal relevance, and what comes back is whole definitions plus one reference hop, cited as exact line ranges.">
  <title>How a search works: four angles, two ways to look, merged, trimmed, cited</title>

  <defs>
    <marker id="hr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>

    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cap{font-size:10px;letter-spacing:.2em;font-weight:700}
      .ink{fill:#0F172A}
      .mut{fill:#64748B}
      .faint{fill:#94A3B8}

      .flow  { animation: hr-dash 2.2s linear infinite; }
      .flow2 { animation: hr-dash 1.7s linear infinite; }
      @keyframes hr-dash { to { stroke-dashoffset:-22 } }

      .scan  { animation: hr-scan 2.6s ease-in-out infinite; }
      @keyframes hr-scan { 0%,100% { opacity:.3 } 50% { opacity:1 } }

      .step  { animation: hr-step 6s ease-out infinite; }
      @keyframes hr-step {
        0%      { opacity:.25 }
        8%, 94% { opacity:1 }
        100%    { opacity:.25 }
      }

      @media (prefers-reduced-motion: reduce) {
        .flow,.flow2,.scan,.step { animation:none; opacity:1 }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="299" rx="18" fill="#FFFFFF" stroke="#E7EAF0"/>

  <g class="mono cap">
    <text x="32"  y="30" fill="#64748B">THE QUESTION</text>
    <text x="266" y="30" fill="#2563EB">TWO CHANNELS</text>
    <text x="500" y="30" fill="#64748B">MERGE AND TRIM</text>
    <text x="734" y="30" fill="#059669">WHAT COMES BACK</text>
  </g>

  <!-- ============ one question, asked four ways ============ -->
  <rect x="32" y="52" width="194" height="34" rx="10" fill="#F7F9FC"/>
  <text class="mono ink" x="46" y="73" font-size="10.5">why is access denied?</text>

  <g>
    <rect x="32" y="98" width="194" height="30" rx="8" fill="#F7F9FC"/>
    <text class="mono faint" x="46" y="117" font-size="9.5">1</text>
    <text class="sans ink" x="64" y="117" font-size="11">how it decides</text>
  </g>
  <g>
    <rect x="32" y="134" width="194" height="30" rx="8" fill="#F7F9FC"/>
    <text class="mono faint" x="46" y="153" font-size="9.5">2</text>
    <text class="sans ink" x="64" y="153" font-size="11">what it reads</text>
  </g>
  <g>
    <rect x="32" y="170" width="194" height="30" rx="8" fill="#F7F9FC"/>
    <text class="mono faint" x="46" y="189" font-size="9.5">3</text>
    <text class="sans ink" x="64" y="189" font-size="11">how it fails</text>
  </g>
  <g>
    <rect x="32" y="206" width="194" height="30" rx="8" fill="#F7F9FC"/>
    <text class="mono faint" x="46" y="225" font-size="9.5">4</text>
    <text class="sans ink" x="64" y="225" font-size="11">how it is tested</text>
  </g>

  <text class="sans faint" x="32" y="266" font-size="10">one question, asked four ways at once</text>

  <!-- ============ each angle searched two ways ============ -->
  <path class="flow" d="M226 167 C 246 167, 248 116, 266 116" fill="none" stroke="#9EC0F5"
        stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7"/>
  <path class="flow" d="M226 167 C 246 167, 248 204, 266 204" fill="none" stroke="#E0BC85"
        stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7" style="animation-delay:.6s"/>

  <rect x="266.5" y="84.5" width="193" height="63" rx="12" fill="#FFFFFF" stroke="#E0E5EE"/>
  <circle cx="288" cy="108" r="4" fill="#2563EB"/>
  <text class="sans ink" x="300" y="112" font-size="12.5" font-weight="600">semantic recall</text>
  <text class="sans faint" x="288" y="132" font-size="9.5">embeddings, matched on intent</text>

  <rect x="266.5" y="172.5" width="193" height="63" rx="12" fill="#FFFFFF" stroke="#E0E5EE"/>
  <circle cx="288" cy="196" r="4" fill="#B45309"/>
  <text class="sans ink" x="300" y="200" font-size="12.5" font-weight="600">lexical precision</text>
  <text class="sans faint" x="288" y="220" font-size="9.5">BM25, matched on the symbol</text>

  <text class="sans faint" x="266" y="266" font-size="10">both run locally, on your CPU</text>

  <!-- ============ merged into one shortlist ============ -->
  <path class="flow" d="M460 116 C 480 116, 482 144, 500 144" fill="none" stroke="#9EC0F5"
        stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7" style="animation-delay:.3s"/>
  <path class="flow" d="M460 204 C 480 204, 482 144, 500 144" fill="none" stroke="#E0BC85"
        stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 7" style="animation-delay:.9s"/>

  <rect x="500.5" y="52.5" width="193" height="183" rx="12" fill="#FFFFFF" stroke="#E0E5EE"/>
  <rect class="scan" x="501" y="53" width="192" height="3" rx="1.5" fill="#2563EB"/>

  <g class="step">
    <circle cx="519" cy="92" r="3" fill="#2563EB"/>
    <text class="sans ink" x="532" y="96" font-size="11">best of both rankings</text>
  </g>
  <g class="step" style="animation-delay:.3s">
    <circle cx="519" cy="128" r="3" fill="#2563EB"/>
    <text class="sans ink" x="532" y="132" font-size="11">every angle keeps a seat</text>
  </g>
  <g class="step" style="animation-delay:.6s">
    <circle cx="519" cy="164" r="3" fill="#2563EB"/>
    <text class="sans ink" x="532" y="168" font-size="11">near-duplicates dropped</text>
  </g>

  <line x1="516" y1="190" x2="678" y2="190" stroke="#EEF1F6" stroke-width="1"/>
  <text class="sans faint" x="516" y="214" font-size="10">many candidates become a few</text>

  <text class="sans faint" x="500" y="266" font-size="10">no angle drowns out another</text>

  <!-- ============ what the agent is handed ============ -->
  <path class="flow2" d="M694 144 H 728" fill="none" stroke="#059669" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hr-arrow)"/>

  <rect x="734.5" y="52.5" width="193" height="183" rx="12" fill="#F7F9FC" stroke="#EDF0F5"/>

  <rect x="750" y="84" width="3" height="14" rx="1.5" fill="#059669"/>
  <text class="sans ink" x="763" y="95" font-size="11">whole functions, never half</text>

  <rect x="750" y="120" width="3" height="14" rx="1.5" fill="#059669"/>
  <text class="sans ink" x="763" y="131" font-size="11">plus what they call</text>

  <rect x="750.5" y="156.5" width="114" height="25" rx="7" fill="#FFFFFF" stroke="#CDE4DA"/>
  <text class="mono" x="763" y="173" font-size="10.5" fill="#047857">PATH:START-END</text>

  <line x1="750" y1="198" x2="912" y2="198" stroke="#E4E9F0" stroke-width="1"/>
  <text class="sans faint" x="750" y="220" font-size="10">line numbers you can quote</text>

  <text class="sans faint" x="734" y="266" font-size="10">search finds them, you choose what to read</text>
</svg>
