    <rect class="cached" x="560" y="88" width="40" height="18" rx="3"/>
    <rect class="cached" x="608" y="88" width="40" height="18" rx="3"/>
    <rect class="cached" x="656" y="88" width="40" height="18" rx="3"/>
    <rect class="cached" x="704" y="88" width="40" height="18" rx="3"/>
    <rect class="cached" x="752" y="88" width="40" height="18" rx="3"/>
    <rect class="cached" x="800" y="88" width="40" height="18" rx="3"/>
    <rect class="cached" x="848" y="88" width="40" height="18" rx="3"/>

    <rect class="cached" x="32" y="114" width="40" height="18" rx="3"/>
    <rect class="cached" x="80" y="114" width="40" height="18" rx="3"/>
    <rect class="delta" x="128" y="114" width="40" height="18" rx="3" fill="#3A1A28" stroke="#FB7185"/>
    <rect class="cached" x="176" y="114" width="40" height="18" rx="3"/>
    <rect class="cached" x="224" y="114" width="40" height="18" rx="3"/>
