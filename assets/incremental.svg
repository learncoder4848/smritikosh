    <rect class="delta" x="512" y="166" width="40" height="18" rx="3" fill="#3A1A28" stroke="#FB7185" style="animation-delay:.9s"/>
    <rect class="cached" x="560" y="166" width="40" height="18" rx="3"/>
    <rect class="cached" x="608" y="166" width="40" height="18" rx="3"/>
    <rect class="cached" x="656" y="166" width="40" height="18" rx="3"/>
