  <rect x="32" y="206" width="12" height="12" rx="3" class="cached"/>
  <text class="s mut" x="52" y="216" font-size="11">unchanged &#8212; skipped by file hash, vectors reused</text>
  <rect x="360" y="206" width="12" height="12" rx="3" fill="#3A1A28" stroke="#FB7185"/>
  <text class="s mut" x="380" y="216" font-size="11">changed &#8212; re-parsed, re-chunked, re-embedded</text>
  <g class="tick">
    <text class="m fg" x="688" y="216" font-size="11">smritikosh index . --watch</text>
    <text class="s mut" x="688" y="234" font-size="10">keeps the index synchronized as files change</text>
  </g>
</svg>
