<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" width="960" height="264" role="img" aria-label="Someone added two lines to a file, so the login check moved down from line 176 to line 178, and every answer that pointed at it is now two lines off unless the index kept up. An index left out of date still answers policy.py lines 176 to 193: that answer arrives instantly and points at the wrong code. Smritikosh answers policy.py lines 178 to 195, taking 3 seconds and pointing at the right code. Reading the one file that changed takes 3 seconds; reading all 59 files in this project takes 40. Keywords: stale index, line numbers moved, exact citations, incremental update, always fresh.">
  <title>The code moved &#8212; did the answer move with it?</title>

  <defs>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .ink{fill:#E6EAF2}
      .mut{fill:#9AA4BA}
      .faint{fill:#77839C}

      .late { animation: mn-late 4s ease-in-out infinite; }
      @keyframes mn-late { 0%,46% { opacity:.3 } 58%,100% { opacity:1 } }

      .show { animation: mn-show 4s ease-in-out infinite; }
      @keyframes mn-show { 0%,20% { opacity:0 } 38%,100% { opacity:1 } }

      @media (prefers-reduced-motion: reduce) {
        .late,.show { animation:none; opacity:1 }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="263" rx="18" fill="#0B1020" stroke="#26304A"/>

  <text class="sans ink" x="32" y="56" font-size="17" font-weight="600">Someone added two lines. The login check moved down.</text>
  <text class="sans mut" x="32" y="80" font-size="12">Every answer that pointed at it is two lines off now &#8212; unless the index kept up.</text>

  <!-- ============ the out-of-date answer ============ -->
  <rect x="32.5" y="100.5" width="895" height="56" rx="12" fill="#21121A" stroke="#4A2230"/>
  <circle cx="58" cy="128" r="4.5" fill="#FB7185"/>
  <text class="sans ink" x="74" y="133" font-size="13" font-weight="600">An index left out of date</text>
  <g class="late">
    <rect x="270.5" y="115.5" width="210" height="26" rx="8" fill="#0D1424" stroke="#4A2230"/>
    <text class="mono" x="284" y="132" font-size="10" fill="#C7D0E2">policy.py</text>
    <text class="mono" x="467" y="132" font-size="10" fill="#FB7185" text-anchor="end">lines 176&#8211;193</text>
    <text class="mono" x="498" y="133" font-size="13" fill="#FB7185">&#10007;</text>
  </g>
  <text class="sans mut" x="524" y="133" font-size="11.5">points two lines high, at the wrong code</text>
  <text class="mono" x="908" y="134" font-size="13" font-weight="700" fill="#FB7185" text-anchor="end">instant</text>

  <!-- ============ the fresh answer ============ -->
  <rect x="32.5" y="166.5" width="895" height="56" rx="12" fill="#0F2B24" stroke="#1F4A3C"/>
  <circle cx="58" cy="194" r="4.5" fill="#34D399"/>
  <text class="sans ink" x="74" y="199" font-size="13" font-weight="600">Smritikosh</text>
  <g class="show">
    <rect x="270.5" y="181.5" width="210" height="26" rx="8" fill="#0D1424" stroke="#1F4A3C"/>
    <text class="mono" x="284" y="198" font-size="10" fill="#C7D0E2">policy.py</text>
    <text class="mono" x="467" y="198" font-size="10" fill="#34D399" text-anchor="end">lines 178&#8211;195</text>
    <text class="mono" x="498" y="199" font-size="13" fill="#34D399">&#10003;</text>
  </g>
  <text class="sans mut" x="524" y="199" font-size="11.5">saw the file change and read it again</text>
  <text class="mono" x="908" y="200" font-size="13" font-weight="700" fill="#34D399" text-anchor="end">3 seconds</text>

  <text class="sans faint" x="32" y="248" font-size="9.5">Reading the one file that changed takes 3 seconds. Reading all 59 files in this project takes 40.</text>
</svg>
