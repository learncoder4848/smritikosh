<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" width="960" height="264" role="img" aria-label="Four measured reasons incremental indexing matters, taken from indexing this repository: 59 files, 413 chunks, embeddings computed locally on an Apple M4 Max. Always fresh: a save is back in the index in 1.5 seconds, against the 38 seconds the first build took. Delta only: an ordinary edit re-embeds 4 of 413 chunks, one percent of the corpus, because 58 of the 59 files are never opened. Never stale: proving that nothing moved takes 0.8 seconds, and a retired chunk leaves the dense vectors, the BM25 postings, and the metadata in the same breath, so no citation can point at a range that no longer exists. Self-invalidating: editing the chunker re-checks all 59 files in 5.8 seconds and still re-embeds only one chunk, because the cache key is a hash of the code as well as the content. Keywords: incremental indexing, delta processing, SHA-256 file skipping, chunk memoization, watch mode, exact citations, cache invalidation, embedding cost.">
  <title>Why incremental, in measured seconds: always fresh, &#916; only, never stale, self-invalidating</title>

  <defs>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cap{font-size:10px;letter-spacing:.2em;font-weight:700}
      .ink{fill:#E6EAF2}
      .mut{fill:#9AA4BA}
      .faint{fill:#77839C}
      .ttl{font-size:13px;font-weight:600}
      .bod{font-size:10px}
      .big{font-size:15px;font-weight:700}
      .met{font-size:9px}

      .tick { animation: wi-tick 3s steps(1,end) infinite; transform-box:fill-box; transform-origin:0% 100%; }
      @keyframes wi-tick { 0%,32% { transform:rotate(0deg) } 33%,65% { transform:rotate(120deg) } 66%,99% { transform:rotate(240deg) } }

      .beat { animation: wi-beat 2.2s ease-in-out infinite; }
      @keyframes wi-beat { 0%,100% { opacity:1 } 50% { opacity:.34 } }

      .draw { stroke-dasharray:20; animation: wi-draw 3.4s ease-in-out infinite; }
      @keyframes wi-draw { 0%,12% { stroke-dashoffset:20 } 34%,88% { stroke-dashoffset:0 } 100% { stroke-dashoffset:20 } }

      .spin { animation: wi-spin 3.6s linear infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes wi-spin { to { transform:rotate(360deg) } }

      @media (prefers-reduced-motion: reduce) {
        .tick,.beat,.draw,.spin { animation:none; stroke-dashoffset:0 }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="263" rx="18" fill="#0B1020" stroke="#26304A"/>

  <g class="mono cap">
    <text x="32"  y="28" fill="#34D399">ALWAYS FRESH</text>
    <text x="260" y="28" fill="#4C8DFF">&#916; ONLY</text>
    <text x="488" y="28" fill="#A78BFA">NEVER STALE</text>
    <text x="716" y="28" fill="#FBBF24">SELF-INVALIDATING</text>
  </g>

  <!-- ============ 1 · always fresh ============ -->
  <rect x="32.5" y="42.5" width="211" height="182" rx="12" fill="#0D1424" stroke="#2B3653"/>
  <rect x="48" y="58" width="36" height="36" rx="10" fill="#12352C"/>
  <g transform="translate(66,76)">
    <circle cx="0" cy="1" r="10" fill="none" stroke="#34D399" stroke-width="1.6"/>
    <line x1="-4" y1="-12" x2="4" y2="-12" stroke="#34D399" stroke-width="1.6" stroke-linecap="round"/>
    <line class="tick" x1="0" y1="1" x2="0" y2="-4" stroke="#34D399" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text class="mono big" x="96" y="82" fill="#34D399">1.5 s</text>
  <text class="sans ink ttl" x="48" y="122">Fresh while you type</text>
  <text class="sans mut bod" x="48" y="143">A save is back in the index before</text>
  <text class="sans mut bod" x="48" y="157">you have switched windows.</text>
  <line x1="48" y1="176" x2="227" y2="176" stroke="#1E2740" stroke-width="1"/>
  <text class="mono met" x="48" y="194" fill="#9AA4BA">after editing one function</text>
  <text class="sans faint met" x="48" y="210">the first build took 38 s</text>

  <!-- ============ 2 · delta only ============ -->
  <rect x="260.5" y="42.5" width="211" height="182" rx="12" fill="#0D1424" stroke="#2B3653"/>
  <rect x="276" y="58" width="36" height="36" rx="10" fill="#25406E"/>
  <g transform="translate(285,67)">
    <g fill="#2E4E85">
      <rect x="0"  y="0"  width="5" height="5" rx="1"/>
      <rect x="7"  y="0"  width="5" height="5" rx="1"/>
      <rect x="14" y="0"  width="5" height="5" rx="1"/>
      <rect x="0"  y="7"  width="5" height="5" rx="1"/>
      <rect class="beat" fill="#FB7185" x="7" y="7" width="5" height="5" rx="1"/>
      <rect x="14" y="7"  width="5" height="5" rx="1"/>
      <rect x="0"  y="14" width="5" height="5" rx="1"/>
      <rect x="7"  y="14" width="5" height="5" rx="1"/>
      <rect x="14" y="14" width="5" height="5" rx="1"/>
    </g>
  </g>
  <text class="mono big" x="324" y="82" fill="#4C8DFF">4 of 413</text>
  <text class="sans ink ttl" x="276" y="122">Chunks that re-embed</text>
  <text class="sans mut bod" x="276" y="143">The other 409 keep the vectors</text>
  <text class="sans mut bod" x="276" y="157">they already had.</text>
  <line x1="276" y1="176" x2="455" y2="176" stroke="#1E2740" stroke-width="1"/>
  <text class="mono met" x="276" y="194" fill="#9AA4BA">1% of the corpus</text>
  <text class="sans faint met" x="276" y="210">58 of 59 files never opened</text>

  <!-- ============ 3 · never stale ============ -->
  <rect x="488.5" y="42.5" width="211" height="182" rx="12" fill="#0D1424" stroke="#2B3653"/>
  <rect x="504" y="58" width="36" height="36" rx="10" fill="#2A2149"/>
  <g transform="translate(513,67)">
    <rect x="0" y="0" width="18" height="4.5" rx="1.5" fill="#4B3A75"/>
    <rect x="0" y="7" width="12" height="4.5" rx="1.5" fill="#4B3A75"/>
    <path class="draw" d="M1 15 L6 19 L17 8" fill="none" stroke="#A78BFA" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="mono big" x="552" y="82" fill="#A78BFA">0.8 s</text>
  <text class="sans ink ttl" x="504" y="122">Citations stay true</text>
  <text class="sans mut bod" x="504" y="143">A retired chunk leaves the vectors,</text>
  <text class="sans mut bod" x="504" y="157">the postings, and the metadata</text>
  <text class="sans mut bod" x="504" y="171">in the same breath.</text>
  <line x1="504" y1="182" x2="683" y2="182" stroke="#1E2740" stroke-width="1"/>
  <text class="mono met" x="504" y="198" fill="#9AA4BA">to prove nothing moved</text>
  <text class="sans faint met" x="504" y="213">never a range that isn&#8217;t there</text>

  <!-- ============ 4 · self-invalidating ============ -->
  <rect x="716.5" y="42.5" width="211" height="182" rx="12" fill="#0D1424" stroke="#2B3653"/>
  <rect x="732" y="58" width="36" height="36" rx="10" fill="#3A2A10"/>
  <g class="spin" transform="translate(750,76)">
    <path d="M -8 1 A 8 8 0 1 1 -1.3 8.7" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M -8 -3.5 L -8 1.4 L -3.2 1.4" fill="none" stroke="#FBBF24" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="mono big" x="780" y="82" fill="#FBBF24">5.8 s</text>
  <text class="sans ink ttl" x="732" y="122">It knows when it is wrong</text>
  <text class="sans mut bod" x="732" y="143">Edit the chunker and all 59 files</text>
  <text class="sans mut bod" x="732" y="157">are re-checked &#8212; and still only</text>
  <text class="sans mut bod" x="732" y="171">one chunk is re-embedded.</text>
  <line x1="732" y1="182" x2="911" y2="182" stroke="#1E2740" stroke-width="1"/>
  <text class="mono met" x="732" y="198" fill="#9AA4BA">sha256(code) + sha256(input)</text>
  <text class="sans faint met" x="732" y="213">no --full to remember</text>

  <text class="sans faint" x="32" y="248" font-size="9">Measured while indexing this repository &#8212; 59 files, 413 chunks, embeddings computed locally on an Apple M4 Max. Rebuilding all of it: 40 s.</text>
</svg>
