<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" width="960" height="264" role="img" aria-label="What each kind of change costs to re-index, measured on this repository: 59 files, 413 chunks, embeddings computed locally on an Apple M4 Max. Change nothing and the run takes 0.8 seconds, because every file hash matches and no file is opened twice. Delete a file and it also takes 0.8 seconds, and its chunks retire from the dense vectors, the BM25 postings, the metadata, and the memo cache together. Edit one function in place and it takes 1.5 seconds, re-embedding 4 of 413 chunks. Edit the chunker or the extractor and it takes 5.8 seconds, because the cache key includes a hash of that code so all 59 files are re-parsed, yet only one chunk is re-embedded. Swap the embedding model and it takes 40 seconds, because all 413 chunks must be embedded again against a model whose vectors are no longer comparable. The first build took 38 seconds. Keywords: incremental indexing, cache invalidation, SHA-256 change detection, memoization, chunk retirement, embedding cost, delta processing.">
  <title>What you changed, and what it cost to catch up &#8212; measured</title>

  <defs>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cap{font-size:10px;letter-spacing:.2em;font-weight:700}
      .ink{fill:#E6EAF2}
      .mut{fill:#9AA4BA}
      .faint{fill:#77839C}
      .row{font-size:11.5px}
      .cost{font-size:9.5px}
      .hint{font-size:8px}
      .secs{font-size:11px;font-weight:700}

      .grow { transform-box:fill-box; transform-origin:left center; animation: cl-grow 5s ease-in-out infinite; }
      @keyframes cl-grow { 0%,4% { transform:scaleX(0) } 24%,92% { transform:scaleX(1) } 100% { transform:scaleX(0) } }

      @media (prefers-reduced-motion: reduce) {
        .grow { animation:none; transform:none }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="263" rx="18" fill="#0B1020" stroke="#26304A"/>

  <g class="mono cap">
    <text x="32"  y="28" fill="#9AA4BA">YOU CHANGED</text>
    <text x="396" y="28" fill="#4C8DFF">WHAT RE-RUNS</text>
    <text x="668" y="28" fill="#9AA4BA" text-anchor="end">TIME</text>
    <text x="692" y="28" fill="#9AA4BA">WHAT IT COSTS</text>
  </g>

  <g stroke="#1C2539" stroke-width="1">
    <line x1="32" y1="80"  x2="928" y2="80"/>
    <line x1="32" y1="114" x2="928" y2="114"/>
    <line x1="32" y1="148" x2="928" y2="148"/>
    <line x1="32" y1="182" x2="928" y2="182"/>
  </g>

  <g fill="#1A2237">
    <rect x="396" y="59"  width="200" height="8" rx="4"/>
    <rect x="396" y="93"  width="200" height="8" rx="4"/>
    <rect x="396" y="127" width="200" height="8" rx="4"/>
    <rect x="396" y="161" width="200" height="8" rx="4"/>
    <rect x="396" y="195" width="200" height="8" rx="4"/>
  </g>

  <!-- ============ nothing ============ -->
  <text class="sans ink row" x="32" y="67">Nothing since the last run</text>
  <text class="mono faint hint" x="376" y="67" text-anchor="end">every hash matches</text>
  <rect class="grow" x="396" y="59" width="5" height="8" rx="4" fill="#34D399"/>
  <text class="mono secs" x="668" y="68" fill="#34D399" text-anchor="end">0.8 s</text>
  <text class="sans mut cost" x="692" y="67">No file is opened twice.</text>

  <!-- ============ deleted file ============ -->
  <text class="sans ink row" x="32" y="101">A file deleted or moved away</text>
  <text class="mono faint hint" x="376" y="101" text-anchor="end">on discovery</text>
  <rect class="grow" x="396" y="93" width="5" height="8" rx="4" fill="#34D399" style="animation-delay:.15s"/>
  <text class="mono secs" x="668" y="102" fill="#34D399" text-anchor="end">0.8 s</text>
  <text class="sans mut cost" x="692" y="101">Its chunks retire from all four stores.</text>

  <!-- ============ one function ============ -->
  <text class="sans ink row" x="32" y="135">One function, edited in place</text>
  <text class="mono faint hint" x="376" y="135" text-anchor="end">sha256(content)</text>
  <rect class="grow" x="396" y="127" width="9" height="8" rx="4" fill="#34D399" style="animation-delay:.3s"/>
  <text class="mono secs" x="668" y="136" fill="#34D399" text-anchor="end">1.5 s</text>
  <text class="sans mut cost" x="692" y="135">4 of 413 chunks re-embedded.</text>

  <!-- ============ the chunker ============ -->
  <text class="sans ink row" x="32" y="169">The chunker or the extractor</text>
  <text class="mono faint hint" x="376" y="169" text-anchor="end">sha256(code)</text>
  <rect class="grow" x="396" y="161" width="29" height="8" rx="4" fill="#FBBF24" style="animation-delay:.45s"/>
  <text class="mono secs" x="668" y="170" fill="#FBBF24" text-anchor="end">5.8 s</text>
  <text class="sans mut cost" x="692" y="169">All 59 files re-parsed. Still 1 chunk embedded.</text>

  <!-- ============ the model ============ -->
  <text class="sans ink row" x="32" y="203">The embedding model</text>
  <text class="mono faint hint" x="376" y="203" text-anchor="end">detect_change</text>
  <rect class="grow" x="396" y="195" width="200" height="8" rx="4" fill="#FB7185" style="animation-delay:.6s"/>
  <text class="mono secs" x="668" y="204" fill="#FB7185" text-anchor="end">40 s</text>
  <text class="sans mut cost" x="692" y="203">All 413 chunks, embedded from nothing.</text>

  <text class="sans faint" x="32" y="234" font-size="9.5">You never have to work out which of these happened. Re-run <tspan class="mono" fill="#9AA4BA">index</tspan> and it does.</text>
  <text class="sans faint" x="32" y="250" font-size="9">Measured while indexing this repository &#8212; 59 files, 413 chunks, embeddings computed locally on an Apple M4 Max. The first build took 38 s.</text>
</svg>
