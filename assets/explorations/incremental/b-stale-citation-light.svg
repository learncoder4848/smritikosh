<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" width="960" height="264" role="img" aria-label="How a citation goes stale, and what it costs to keep it honest. At 09:14 the function authorize lives at auth/policy.py lines 176 to 193 and the agent cites that range correctly. At 09:20 someone adds two lines near the top of the file, every definition below slides down, and authorize now lives at lines 178 to 195. A stale index still answers 176 to 193: it costs nothing to produce and it quotes the tail of the function above with complete confidence. Smritikosh notices the content hash changed, re-reads that one file, re-embeds the 20 chunks whose line ranges moved in 3.1 seconds, and answers 178 to 195. Rebuilding the whole index instead would take 40 seconds. Measured on this repository with 59 files and 413 chunks, embeddings computed locally on an Apple M4 Max. Keywords: stale index, line drift, exact citations, incremental re-indexing, SHA-256 change detection, chunk retirement, indexing cost.">
  <title>A stale index does not fail loudly &#8212; it fails precisely, and catching it costs 3.1 seconds</title>

  <defs>
    <marker id="sc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>

    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cap{font-size:10px;letter-spacing:.2em;font-weight:700}
      .ink{fill:#0F172A}
      .mut{fill:#64748B}
      .faint{fill:#94A3B8}

      .slide { animation: sc-slide 4.4s ease-in-out infinite; }
      @keyframes sc-slide { 0%,18% { transform:translateY(-30px); opacity:0 } 34%,100% { transform:translateY(0); opacity:1 } }

      .land { animation: sc-land 4.4s ease-in-out infinite; }
      @keyframes sc-land { 0%,20% { opacity:0 } 40%,100% { opacity:1 } }

      .wrong { animation: sc-wrong 4.4s ease-in-out infinite; }
      @keyframes sc-wrong { 0%,44% { opacity:.25 } 56%,100% { opacity:1 } }

      @media (prefers-reduced-motion: reduce) {
        .slide,.land,.wrong { animation:none; opacity:1; transform:none }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="263" rx="18" fill="#FFFFFF" stroke="#C3CCD9"/>

  <g class="mono cap">
    <text x="32"  y="28" fill="#64748B">09:14 &#183; THE ANSWER</text>
    <text x="306" y="28" fill="#E11D48">09:20 &#183; SOMEONE ADDS AN IMPORT</text>
    <text x="612" y="28" fill="#64748B">WHAT THE AGENT IS TOLD, AND WHAT IT COST</text>
  </g>

  <!-- ============ before ============ -->
  <rect x="32.5" y="42.5" width="249" height="182" rx="12" fill="#FDFDFD" stroke="#BDC7D7"/>
  <text class="mono" x="48" y="64" font-size="9.5" fill="#334155">auth/policy.py</text>
  <line x1="48" y1="72" x2="266" y2="72" stroke="#E2E8F0"/>

  <rect x="72" y="104" width="2.5" height="104" rx="1.25" fill="#059669"/>
  <g class="mono" font-size="8" fill="#94A3B8" text-anchor="end">
    <text x="64" y="87">174</text><text x="64" y="102">175</text><text x="64" y="117">176</text>
    <text x="64" y="132">177</text><text x="64" y="147">178</text><text x="64" y="162">179</text>
    <text x="64" y="177">180</text><text x="64" y="192">181</text>
  </g>
  <g fill="#D7DEE8">
    <rect x="84" y="80"  width="112" height="5" rx="2.5"/>
    <rect x="84" y="95"  width="78"  height="5" rx="2.5"/>
    <rect x="84" y="125" width="126" height="5" rx="2.5"/>
    <rect x="84" y="140" width="150" height="5" rx="2.5"/>
    <rect x="84" y="155" width="96"  height="5" rx="2.5"/>
    <rect x="84" y="170" width="134" height="5" rx="2.5"/>
    <rect x="84" y="185" width="104" height="5" rx="2.5"/>
  </g>
  <text class="mono" x="84" y="118" font-size="8.5" fill="#0F172A">def authorize(user, action):</text>
  <text class="mono" x="84" y="209" font-size="9" fill="#94A3B8">&#8942;</text>
  <text class="mono" x="266" y="118" font-size="8.5" fill="#047857" text-anchor="end">176&#8211;193</text>

  <text class="sans faint" x="296" y="139" font-size="13">&#8250;</text>

  <!-- ============ after ============ -->
  <rect x="306.5" y="42.5" width="249" height="182" rx="12" fill="#FDFDFD" stroke="#BDC7D7"/>
  <text class="mono" x="322" y="64" font-size="9.5" fill="#334155">auth/policy.py</text>
  <line x1="322" y1="72" x2="540" y2="72" stroke="#E2E8F0"/>

  <g class="slide">
    <rect x="346" y="134" width="2.5" height="74" rx="1.25" fill="#059669"/>
    <g class="mono" font-size="8" fill="#94A3B8" text-anchor="end">
      <text x="338" y="147">178</text><text x="338" y="162">179</text>
      <text x="338" y="177">180</text><text x="338" y="192">181</text>
    </g>
    <g fill="#D7DEE8">
      <rect x="358" y="155" width="96"  height="5" rx="2.5"/>
      <rect x="358" y="170" width="134" height="5" rx="2.5"/>
      <rect x="358" y="185" width="104" height="5" rx="2.5"/>
    </g>
    <text class="mono" x="358" y="148" font-size="8.5" fill="#0F172A">def authorize(user, action):</text>
    <text class="mono" x="540" y="148" font-size="8.5" fill="#047857" text-anchor="end">178&#8211;195</text>
  </g>

  <g class="mono" font-size="8" fill="#94A3B8" text-anchor="end">
    <text x="338" y="87">174</text><text x="338" y="102">175</text>
  </g>
  <g fill="#D7DEE8">
    <rect x="358" y="80" width="112" height="5" rx="2.5"/>
    <rect x="358" y="95" width="78"  height="5" rx="2.5"/>
  </g>

  <rect x="344" y="108" width="196" height="16" rx="4" fill="#FFE4E6"/>
  <text class="mono" x="338" y="119" font-size="8" fill="#E11D48" text-anchor="end">176</text>
  <text class="mono" x="350" y="120" font-size="8.5" fill="#BE123C">+ import hashlib</text>
  <rect x="344" y="126" width="196" height="6" rx="3" fill="#FFE4E6"/>

  <text class="mono" x="540" y="209" font-size="8" fill="#E11D48" text-anchor="end">+2 lines</text>

  <path d="M566 133 H 600" fill="none" stroke="#94A3B8" stroke-width="1.4"
        stroke-linecap="round" marker-end="url(#sc-arrow)"/>

  <!-- ============ the two answers, and their price ============ -->
  <rect x="612.5" y="42.5" width="315" height="86" rx="12" fill="#FEF2F3" stroke="#F2C9CF"/>
  <circle cx="630" cy="60" r="3.5" fill="#E11D48"/>
  <text class="sans ink" x="642" y="64" font-size="12" font-weight="600">A stale index</text>
  <text class="mono" x="908" y="64" font-size="12" font-weight="700" fill="#E11D48" text-anchor="end">0.0 s</text>
  <g class="wrong">
    <rect x="628.5" y="76.5" width="163" height="22" rx="7" fill="#FDFDFD" stroke="#F2C9CF"/>
    <text class="mono" x="640" y="91" font-size="9" fill="#334155">auth/policy.py</text>
    <text class="mono" x="781" y="91" font-size="9" fill="#E11D48" text-anchor="end">176&#8211;193</text>
    <text class="mono" x="802" y="92" font-size="11" fill="#E11D48">&#10007;</text>
  </g>
  <text class="sans mut" x="628" y="116" font-size="9.5">Free to produce. It quotes the function above instead.</text>

  <rect x="612.5" y="138.5" width="315" height="86" rx="12" fill="#F1FAF6" stroke="#BFE3D3"/>
  <circle cx="630" cy="156" r="3.5" fill="#059669"/>
  <text class="sans ink" x="642" y="160" font-size="12" font-weight="600">Smritikosh</text>
  <text class="mono" x="908" y="160" font-size="12" font-weight="700" fill="#059669" text-anchor="end">3.1 s</text>
  <g class="land">
    <rect x="628.5" y="172.5" width="163" height="22" rx="7" fill="#FDFDFD" stroke="#BFE3D3"/>
    <text class="mono" x="640" y="187" font-size="9" fill="#334155">auth/policy.py</text>
    <text class="mono" x="781" y="187" font-size="9" fill="#047857" text-anchor="end">178&#8211;195</text>
    <text class="mono" x="802" y="188" font-size="11" fill="#059669">&#10003;</text>
  </g>
  <text class="sans mut" x="628" y="212" font-size="9.5">One file re-read. 20 of 413 chunks re-embedded.</text>

  <text class="sans faint" x="32" y="248" font-size="9">Measured while indexing this repository &#8212; 59 files, 413 chunks, embeddings computed locally on an Apple M4 Max. Rebuilding instead of catching up: 40 s.</text>
</svg>
