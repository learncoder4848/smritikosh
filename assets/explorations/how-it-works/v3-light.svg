<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="How Smritikosh works, end to end. Step 1, walk the tree: discovery respects gitignore and a language router sends each remaining file to the right parser, covering Python, TypeScript, JavaScript, Java, Kotlin, Markdown and a few structured formats. Step 2, keep whole thoughts: parse the tree-sitter AST, extract classes, functions and methods, then chunk so a range is always one complete definition rather than the tail of one function and the head of the next. Step 3, index three ways, each drawn as a small picture: a vector cloud of scattered dots for meaning, a pair of code identifiers for exact names matched by BM25, and a node-and-edge graph for the call graph, which is still to come. Step 4, re-read only the delta: a content hash decides whether a file is opened at all, so a changed file is re-read while unchanged ones are skipped and their chunks keep the vectors they already have. Step 5, persist: chunks and metadata, dense vectors, BM25 postings, and the hash and memo state all live in one local smritikosh.duckdb file. Search reads that same file back: a question is fused across the rankings, coverage is kept and near-duplicates dropped, survivors expand to whole definitions plus one reference hop, and the answer comes back as an exact path with a start and end line such as policy.py 176 to 193, never the file body.">
  <title>Indexing walks the tree into one DuckDB file; search reads that same file back as exact line ranges</title>

  <defs>
    <marker id="hw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <marker id="hw-arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#E11D48"/>
    </marker>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cap{font-size:10px;letter-spacing:.2em;font-weight:700}
      .tag{font-size:8px;letter-spacing:.14em;font-weight:700}
      .ink{fill:#0F172A}
      .mut{fill:#64748B}
      .faint{fill:#94A3B8}

      .flow { animation: hw-dash 2.2s linear infinite; }
      @keyframes hw-dash { to { stroke-dashoffset:-22 } }

      .pulse { animation: hw-pulse 1.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes hw-pulse { 0%,100% { transform:scale(1); opacity:1 } 50% { transform:scale(1.25); opacity:.55 } }

      .scan { animation: hw-scan 2.8s ease-in-out infinite; }
      @keyframes hw-scan { 0%,100% { opacity:.25 } 50% { opacity:1 } }

      .twinkle { animation: hw-twinkle 3.2s ease-in-out infinite; }
      @keyframes hw-twinkle { 0%,100% { opacity:.35 } 50% { opacity:1 } }

      @media (prefers-reduced-motion: reduce) {
        .flow,.pulse,.scan,.twinkle { animation:none }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="439" rx="18" fill="#FFFFFF" stroke="#C3CCD9"/>

  <g class="mono cap">
    <text x="32"  y="30" fill="#64748B">1  WALK THE TREE</text>
    <text x="266" y="30" fill="#2563EB">2  KEEP WHOLE THOUGHTS</text>
    <text x="500" y="30" fill="#64748B">3  INDEX THREE WAYS</text>
    <text x="734" y="30" fill="#E11D48">4  RE-READ ONLY &#916;</text>
  </g>

  <!-- ============ 1 walk the tree ============ -->
  <rect x="32.5" y="48.5" width="193" height="172" rx="12" fill="#FFFFFF" stroke="#BDC7D7"/>
  <rect class="scan" x="33" y="49" width="192" height="3" rx="1.5" fill="#2563EB"/>

  <g class="mono" font-size="10">
    <text x="48" y="78" fill="#94A3B8">auth-svc/</text>
    <text x="60" y="100" fill="#0F172A">src/policy.py</text>
    <text x="60" y="120" fill="#0F172A">src/session.py</text>
    <text x="60" y="140" fill="#CBD5E1" text-decoration="line-through">node_modules/</text>
    <text x="60" y="160" fill="#0F172A">docs/auth.md</text>
  </g>
  <text class="sans faint" x="48" y="190" font-size="10">gitignore, then the language router</text>
  <text class="sans faint" x="48" y="208" font-size="10">Python, TS, JS, Java, Kotlin, MD</text>

  <path class="flow" d="M226 134 H 258" fill="none" stroke="#059669" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hw-arrow)"/>

  <!-- ============ 2 keep whole thoughts ============ -->
  <rect x="266.5" y="48.5" width="193" height="172" rx="12" fill="#FFFFFF" stroke="#BDC7D7"/>

  <circle cx="286" cy="82" r="4" fill="#2563EB"/>
  <text class="sans ink" x="298" y="86" font-size="12.5" font-weight="600">parse</text>
  <text class="sans faint" x="298" y="103" font-size="10">tree-sitter AST</text>

  <circle cx="286" cy="132" r="4" fill="#2563EB"/>
  <text class="sans ink" x="298" y="136" font-size="12.5" font-weight="600">extract</text>
  <text class="sans faint" x="298" y="153" font-size="10">classes, functions, methods</text>

  <circle cx="286" cy="182" r="4" fill="#059669"/>
  <text class="sans ink" x="298" y="186" font-size="12.5" font-weight="600">chunk</text>
  <text class="sans faint" x="298" y="203" font-size="10">never half of two functions</text>

  <path class="flow" d="M460 134 H 492" fill="none" stroke="#059669" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hw-arrow)" style="animation-delay:.3s"/>

  <!-- ============ 3 index three ways, drawn not described ============ -->
  <rect x="500.5" y="48.5" width="193" height="172" rx="12" fill="#FFFFFF" stroke="#BDC7D7"/>

  <!-- a cloud of vectors -->
  <rect x="516.5" y="58.5" width="161" height="48" rx="10" fill="#F7F9FC" stroke="#D3DBE6"/>
  <text class="mono tag" x="530" y="75" fill="#2563EB">VECTOR CLOUD</text>
  <g fill="#2563EB">
    <circle cx="534" cy="93" r="1.8" opacity=".45"/>
    <circle class="twinkle" cx="546" cy="87" r="2.1"/>
    <circle cx="556" cy="96" r="1.5" opacity=".55"/>
    <circle cx="566" cy="89" r="2.2" opacity=".85"/>
    <circle cx="578" cy="97" r="1.6" opacity=".4"/>
    <circle class="twinkle" cx="589" cy="90" r="1.9" style="animation-delay:.6s"/>
    <circle cx="600" cy="85" r="1.5" opacity=".6"/>
    <circle cx="610" cy="95" r="2" opacity=".75"/>
    <circle cx="622" cy="88" r="1.6" opacity=".5"/>
    <circle class="twinkle" cx="633" cy="96" r="1.8" style="animation-delay:1.2s"/>
    <circle cx="645" cy="89" r="2.1" opacity=".8"/>
    <circle cx="657" cy="95" r="1.5" opacity=".45"/>
    <circle cx="666" cy="87" r="1.8" opacity=".6"/>
  </g>

  <!-- the exact names themselves -->
  <rect x="516.5" y="114.5" width="161" height="48" rx="10" fill="#F7F9FC" stroke="#D3DBE6"/>
  <text class="mono tag" x="530" y="131" fill="#B45309">EXACT NAMES &#183; BM25</text>
  <rect x="529.5" y="140.5" width="66" height="15" rx="4" fill="#FFFFFF" stroke="#C0CAD9"/>
  <text class="mono" x="536" y="151" font-size="8.5" fill="#B45309">authorize()</text>
  <rect x="601.5" y="140.5" width="56" height="15" rx="4" fill="#FFFFFF" stroke="#C0CAD9"/>
  <text class="mono" x="608" y="151" font-size="8.5" fill="#B45309">user_id</text>

  <!-- callers and callees -->
  <rect x="516.5" y="170.5" width="161" height="48" rx="10" fill="#F7F9FC" stroke="#D3DBE6"/>
  <text class="mono tag" x="530" y="187" fill="#7C3AED">CALL GRAPH</text>
  <rect x="624.5" y="177.5" width="34" height="14" rx="7" fill="none" stroke="#C0CAD9"/>
  <text class="mono" x="641" y="187" font-size="7.5" fill="#94A3B8" text-anchor="middle">soon</text>
  <g stroke="#7C3AED" stroke-width="1.1" stroke-opacity=".55" fill="none">
    <path d="M538 204 L 570 198"/>
    <path d="M538 204 L 570 210"/>
    <path d="M570 198 L 602 204"/>
    <path d="M570 210 L 602 204"/>
    <path d="M602 204 L 634 198"/>
    <path d="M602 204 L 634 210"/>
  </g>
  <g fill="#7C3AED">
    <circle cx="538" cy="204" r="2.8"/>
    <circle cx="570" cy="198" r="2.4"/>
    <circle cx="570" cy="210" r="2.4"/>
    <circle cx="602" cy="204" r="2.8"/>
    <circle cx="634" cy="198" r="2.4" opacity=".6"/>
    <circle cx="634" cy="210" r="2.4" opacity=".6"/>
  </g>

  <path class="flow" d="M694 134 H 726" fill="none" stroke="#E11D48" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hw-arrow-rose)" style="animation-delay:.6s"/>

  <!-- ============ 4 re-read only the delta ============ -->
  <rect x="734.5" y="48.5" width="193" height="172" rx="12" fill="#F7F9FC" stroke="#C8D1DE"/>

  <g class="mono" font-size="10">
    <rect x="750.5" y="66.5" width="161" height="28" rx="7" fill="#FFFFFF" stroke="#C0CAD9"/>
    <circle class="pulse" cx="766" cy="80" r="3.2" fill="#E11D48"/>
    <text x="778" y="84" fill="#0F172A">policy.py  changed</text>

    <rect x="750.5" y="102.5" width="161" height="28" rx="7" fill="#FFFFFF" stroke="#C0CAD9"/>
    <circle cx="766" cy="116" r="3.2" fill="#CBD5E1"/>
    <text x="778" y="120" fill="#94A3B8">session.py  skip</text>

    <rect x="750.5" y="138.5" width="161" height="28" rx="7" fill="#FFFFFF" stroke="#C0CAD9"/>
    <circle cx="766" cy="152" r="3.2" fill="#CBD5E1"/>
    <text x="778" y="156" fill="#94A3B8">auth.md  skip</text>
  </g>

  <text class="sans faint" x="750" y="190" font-size="10">a content hash opens the file, or not</text>
  <text class="sans faint" x="750" y="208" font-size="10">skipped chunks keep their vectors</text>

  <!-- ============ 5 persist ============ -->
  <path class="flow" d="M480 228 V 256" fill="none" stroke="#059669" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hw-arrow)" style="animation-delay:.9s"/>

  <text class="mono cap" x="32" y="252" fill="#0F766E">5  PERSIST &#183; ONE DUCKDB FILE</text>

  <rect x="32.5" y="264.5" width="895" height="54" rx="12" fill="#F0FDFA" stroke="#99F6E4"/>
  <text class="mono ink" x="48" y="297" font-size="12.5" font-weight="700">smritikosh.duckdb</text>

  <rect x="214.5" y="277.5" width="148" height="28" rx="8" fill="#FFFFFF" stroke="#C0CAD9"/>
  <text class="sans ink" x="228" y="296" font-size="11.5" font-weight="500">chunks + metadata</text>

  <rect x="374.5" y="277.5" width="148" height="28" rx="8" fill="#FFFFFF" stroke="#C0CAD9"/>
  <text class="sans ink" x="388" y="296" font-size="11.5" font-weight="500">dense vectors</text>

  <rect x="534.5" y="277.5" width="168" height="28" rx="8" fill="#FFFFFF" stroke="#C0CAD9"/>
  <text class="sans ink" x="548" y="296" font-size="11.5" font-weight="500">BM25 postings</text>

  <rect x="714.5" y="277.5" width="196" height="28" rx="8" fill="#FFFFFF" stroke="#C0CAD9"/>
  <text class="sans ink" x="728" y="296" font-size="11.5" font-weight="500">hash + memo state</text>

  <!-- ============ search reads it back ============ -->
  <path class="flow" d="M480 324 V 354" fill="none" stroke="#059669" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hw-arrow)" style="animation-delay:1.2s"/>

  <text class="mono cap" x="32" y="348" fill="#64748B">SEARCH &#183; READS THAT SAME FILE</text>
  <text class="sans faint" x="928" y="348" font-size="10" text-anchor="end">line ranges only &#8212; never the file body</text>

  <rect x="32.5" y="362.5" width="895" height="56" rx="12" fill="#FFFFFF" stroke="#BDC7D7"/>

  <rect x="48.5" y="376.5" width="200" height="30" rx="8" fill="#F7F9FC" stroke="#D3DBE6"/>
  <text class="mono ink" x="62" y="396" font-size="10.5">why can&#8217;t users log in?</text>

  <path class="flow" d="M258 391 H 278" fill="none" stroke="#059669" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hw-arrow)"/>

  <rect x="286.5" y="376.5" width="208" height="30" rx="8" fill="#F7F9FC" stroke="#D3DBE6"/>
  <text class="sans ink" x="300" y="396" font-size="11.5">fuse &#183; cover &#183; de-duplicate</text>

  <path class="flow" d="M504 391 H 524" fill="none" stroke="#059669" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hw-arrow)" style="animation-delay:.3s"/>

  <rect x="532.5" y="376.5" width="208" height="30" rx="8" fill="#F7F9FC" stroke="#D3DBE6"/>
  <text class="sans ink" x="546" y="396" font-size="11.5">expand to whole definitions</text>

  <path class="flow" d="M750 391 H 770" fill="none" stroke="#059669" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hw-arrow)" style="animation-delay:.6s"/>

  <rect x="778.5" y="376.5" width="133" height="30" rx="8" fill="#FFFFFF" stroke="#059669"/>
  <text class="mono" x="791" y="396" font-size="10.5" fill="#059669">policy.py 176&#8211;193</text>
</svg>
