<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="How Smritikosh works, end to end, for documents, code and config alike. Step 1, walk the tree: it discovers the files in a project, here a handbook, a source file and a settings file, and skips what you ignore, shown struck through. Step 2, keep whole thoughts: it parses structure rather than plain text, extracts the definitions and sections it finds, and chunks them so a range is always one whole idea. Step 3, index three ways, each drawn as a small picture: a cloud of scattered dots for semantic recall, two literal tokens for lexical precision, and a five-node graph of connected callers and callees for the call graph, which is still to come. Step 4, re-read only the delta: the changed file is read again while the unchanged ones are skipped. Step 5, persist: chunks and metadata, dense vectors, BM25 postings, and the hash and memo state all live in one local database file, smritikosh.duckdb. Search reads that same file back: a question is fused across the rankings, coverage is kept and near-duplicates dropped, survivors expand to whole passages, and the answer comes back as an exact path with a start and end line, never the file body.">
  <title>Indexing walks the tree into one database file; search reads that same file back as exact line ranges</title>

  <defs>
    <marker id="hw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#34D399"/>
    </marker>
    <marker id="hw-arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#FB7185"/>
    </marker>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cap{font-size:10px;letter-spacing:.2em;font-weight:700}
      .tag{font-size:8px;letter-spacing:.14em;font-weight:700}
      .ink{fill:#E6EAF2}
      .mut{fill:#9AA4BA}
      .faint{fill:#77839C}

      .flow { animation: hw-dash 2.2s linear infinite; }
      @keyframes hw-dash { to { stroke-dashoffset:-22 } }

      .pulse { animation: hw-pulse 1.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes hw-pulse { 0%,100% { transform:scale(1); opacity:1 } 50% { transform:scale(1.25); opacity:.55 } }

      .scan { animation: hw-scan 2.8s ease-in-out infinite; }
      @keyframes hw-scan { 0%,100% { opacity:.25 } 50% { opacity:1 } }

      .twinkle { animation: hw-twinkle 3.2s ease-in-out infinite; }
      @keyframes hw-twinkle { 0%,100% { opacity:.35 } 50% { opacity:1 } }

      @media (prefers-reduced-motion: reduce) {
        .flow,.pulse,.scan,.twinkle { animation:none }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="439" rx="18" fill="#0B1020" stroke="#26304A"/>

  <g class="mono cap">
    <text x="32"  y="30" fill="#9AA4BA">1  WALK THE TREE</text>
    <text x="266" y="30" fill="#4C8DFF">2  KEEP WHOLE THOUGHTS</text>
    <text x="500" y="30" fill="#9AA4BA">3  INDEX THREE WAYS</text>
    <text x="734" y="30" fill="#FB7185">4  RE-READ ONLY &#916;</text>
  </g>

  <!-- ============ 1 walk the tree ============ -->
  <rect x="32.5" y="48.5" width="193" height="172" rx="12" fill="#0B1020" stroke="#33415C"/>
  <rect class="scan" x="33" y="49" width="192" height="3" rx="1.5" fill="#4C8DFF"/>

  <g class="mono" font-size="11">
    <text x="48" y="86" fill="#77839C">project/</text>
    <text x="64" y="118" fill="#E6EAF2">handbook.md</text>
    <text x="64" y="148" fill="#E6EAF2">policy.py</text>
    <text x="64" y="178" fill="#E6EAF2">settings.toml</text>
    <text x="64" y="208" fill="#3A4660" text-decoration="line-through">build/</text>
  </g>

  <path class="flow" d="M226 134 H 258" fill="none" stroke="#34D399" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hw-arrow)"/>

  <!-- ============ 2 keep whole thoughts ============ -->
  <rect x="266.5" y="48.5" width="193" height="172" rx="12" fill="#0B1020" stroke="#33415C"/>

  <circle cx="286" cy="82" r="4" fill="#4C8DFF"/>
  <text class="sans ink" x="298" y="86" font-size="12.5" font-weight="600">parse</text>
  <text class="sans faint" x="298" y="103" font-size="10">structure, not plain text</text>

  <circle cx="286" cy="132" r="4" fill="#4C8DFF"/>
  <text class="sans ink" x="298" y="136" font-size="12.5" font-weight="600">extract</text>
  <text class="sans faint" x="298" y="153" font-size="10">definitions and sections</text>

  <circle cx="286" cy="182" r="4" fill="#34D399"/>
  <text class="sans ink" x="298" y="186" font-size="12.5" font-weight="600">chunk</text>
  <text class="sans faint" x="298" y="203" font-size="10">one whole idea per range</text>

  <path class="flow" d="M460 134 H 492" fill="none" stroke="#34D399" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hw-arrow)" style="animation-delay:.3s"/>

  <!-- ============ 3 index three ways, drawn not described ============ -->
  <rect x="500.5" y="48.5" width="193" height="172" rx="12" fill="#0B1020" stroke="#33415C"/>

  <!-- meaning, as a cloud of points -->
  <rect x="516.5" y="56.5" width="161" height="44" rx="10" fill="#121A2E" stroke="#33415C"/>
  <text class="mono tag" x="530" y="72" fill="#4C8DFF">SEMANTIC RECALL</text>
  <g fill="#4C8DFF">
    <circle cx="534" cy="89" r="1.8" opacity=".45"/>
    <circle class="twinkle" cx="546" cy="84" r="2.1"/>
    <circle cx="556" cy="92" r="1.5" opacity=".55"/>
    <circle cx="566" cy="86" r="2.2" opacity=".85"/>
    <circle cx="578" cy="93" r="1.6" opacity=".4"/>
    <circle class="twinkle" cx="589" cy="86" r="1.9" style="animation-delay:.6s"/>
    <circle cx="600" cy="82" r="1.5" opacity=".6"/>
    <circle cx="610" cy="91" r="2" opacity=".75"/>
    <circle cx="622" cy="85" r="1.6" opacity=".5"/>
    <circle class="twinkle" cx="633" cy="92" r="1.8" style="animation-delay:1.2s"/>
    <circle cx="645" cy="86" r="2.1" opacity=".8"/>
    <circle cx="657" cy="91" r="1.5" opacity=".45"/>
    <circle cx="666" cy="84" r="1.8" opacity=".6"/>
  </g>

  <!-- the literal words themselves -->
  <rect x="516.5" y="106.5" width="161" height="44" rx="10" fill="#121A2E" stroke="#33415C"/>
  <text class="mono tag" x="530" y="122" fill="#F59E0B">LEXICAL PRECISION</text>
  <rect x="529.5" y="130.5" width="66" height="15" rx="4" fill="#0B1020" stroke="#33415C"/>
  <text class="mono" x="536" y="141" font-size="8.5" fill="#F59E0B">authorize()</text>
  <rect x="601.5" y="130.5" width="52" height="15" rx="4" fill="#0B1020" stroke="#33415C"/>
  <text class="mono" x="608" y="141" font-size="8.5" fill="#F59E0B">timeout</text>

  <!-- callers and callees -->
  <rect x="516.5" y="156.5" width="161" height="62" rx="10" fill="#121A2E" stroke="#33415C"/>
  <text class="mono tag" x="530" y="172" fill="#A78BFA">CALL GRAPH</text>
  <rect x="624.5" y="163.5" width="34" height="14" rx="7" fill="none" stroke="#33415C"/>
  <text class="mono" x="641" y="173" font-size="7.5" fill="#77839C" text-anchor="middle">soon</text>

  <g stroke="#A78BFA" stroke-width="1.2" stroke-opacity="0.7" fill="none">
    <line x1="546.5" y1="196.5" x2="576.5" y2="186.5"/>
    <line x1="546.5" y1="196.5" x2="578.5" y2="211.5"/>
    <line x1="576.5" y1="186.5" x2="610.5" y2="196.5"/>
    <line x1="578.5" y1="211.5" x2="610.5" y2="196.5"/>
    <line x1="610.5" y1="196.5" x2="632.5" y2="210.5"/>
  </g>
  <g fill="#A78BFA">
    <circle cx="546.5" cy="196.5" r="4"/>
    <circle cx="576.5" cy="186.5" r="4"/>
    <circle cx="578.5" cy="211.5" r="4"/>
    <circle cx="610.5" cy="196.5" r="4"/>
    <circle cx="632.5" cy="210.5" r="4"/>
  </g>

  <path class="flow" d="M694 134 H 726" fill="none" stroke="#FB7185" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hw-arrow-rose)" style="animation-delay:.6s"/>

  <!-- ============ 4 re-read only the delta ============ -->
  <rect x="734.5" y="48.5" width="193" height="172" rx="12" fill="#121A2E" stroke="#33415C"/>

  <g class="mono" font-size="10.5">
    <rect x="750.5" y="78.5" width="161" height="30" rx="8" fill="#0B1020" stroke="#33415C"/>
    <circle class="pulse" cx="768" cy="93" r="3.4" fill="#FB7185"/>
    <text x="782" y="97" fill="#E6EAF2">handbook.md</text>
    <text x="898" y="97" fill="#FB7185" text-anchor="end">read</text>

    <rect x="750.5" y="122.5" width="161" height="30" rx="8" fill="#0B1020" stroke="#33415C"/>
    <circle cx="768" cy="137" r="3.4" fill="#3A4660"/>
    <text x="782" y="141" fill="#77839C">policy.py</text>
    <text x="898" y="141" fill="#77839C" text-anchor="end">skip</text>

    <rect x="750.5" y="166.5" width="161" height="30" rx="8" fill="#0B1020" stroke="#33415C"/>
    <circle cx="768" cy="181" r="3.4" fill="#3A4660"/>
    <text x="782" y="185" fill="#77839C">settings.toml</text>
    <text x="898" y="185" fill="#77839C" text-anchor="end">skip</text>
  </g>

  <!-- ============ 5 persist ============ -->
  <path class="flow" d="M480 228 V 256" fill="none" stroke="#34D399" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hw-arrow)" style="animation-delay:.9s"/>

  <text class="mono cap" x="32" y="252" fill="#34D399">5  PERSIST &#183; ONE FILE ON DISK</text>

  <rect x="32.5" y="264.5" width="895" height="54" rx="12" fill="#0F1F1C" stroke="#14532D"/>

  <g stroke="#34D399" stroke-width="1.3" fill="#0B1020">
    <path d="M50 283 L50 299 A9 3.6 0 0 0 68 299 L68 283"/>
    <ellipse cx="59" cy="283" rx="9" ry="3.6"/>
  </g>
  <path d="M50 291 A9 3.6 0 0 0 68 291" fill="none" stroke="#34D399" stroke-width="1.1" stroke-opacity=".45"/>
  <text class="mono ink" x="80" y="297" font-size="12.5" font-weight="700">smritikosh.duckdb</text>

  <rect x="230.5" y="277.5" width="148" height="28" rx="8" fill="#0B1020" stroke="#33415C"/>
  <text class="sans ink" x="244" y="296" font-size="11.5" font-weight="500">chunks + metadata</text>

  <rect x="388.5" y="277.5" width="148" height="28" rx="8" fill="#0B1020" stroke="#33415C"/>
  <text class="sans ink" x="402" y="296" font-size="11.5" font-weight="500">dense vectors</text>

  <rect x="546.5" y="277.5" width="156" height="28" rx="8" fill="#0B1020" stroke="#33415C"/>
  <text class="sans ink" x="560" y="296" font-size="11.5" font-weight="500">BM25 postings</text>

  <rect x="712.5" y="277.5" width="198" height="28" rx="8" fill="#0B1020" stroke="#33415C"/>
  <text class="sans ink" x="726" y="296" font-size="11.5" font-weight="500">hash + memo state</text>

  <!-- ============ search reads it back ============ -->
  <path class="flow" d="M480 324 V 354" fill="none" stroke="#34D399" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hw-arrow)" style="animation-delay:1.2s"/>

  <text class="mono cap" x="32" y="348" fill="#9AA4BA">SEARCH &#183; READS THAT SAME FILE</text>
  <text class="sans faint" x="928" y="348" font-size="10" text-anchor="end">line ranges only &#8212; never the file body</text>

  <rect x="32.5" y="362.5" width="895" height="56" rx="12" fill="#0B1020" stroke="#33415C"/>

  <rect x="48.5" y="376.5" width="200" height="30" rx="8" fill="#121A2E" stroke="#33415C"/>
  <text class="mono ink" x="62" y="396" font-size="10.5">why can&#8217;t users log in?</text>

  <path class="flow" d="M258 391 H 278" fill="none" stroke="#34D399" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hw-arrow)"/>

  <rect x="286.5" y="376.5" width="208" height="30" rx="8" fill="#121A2E" stroke="#33415C"/>
  <text class="sans ink" x="300" y="396" font-size="11.5">fuse &#183; cover &#183; de-duplicate</text>

  <path class="flow" d="M504 391 H 524" fill="none" stroke="#34D399" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hw-arrow)" style="animation-delay:.3s"/>

  <rect x="532.5" y="376.5" width="208" height="30" rx="8" fill="#121A2E" stroke="#33415C"/>
  <text class="sans ink" x="546" y="396" font-size="11.5">expand to whole passages</text>

  <path class="flow" d="M750 391 H 770" fill="none" stroke="#34D399" stroke-opacity="0.7"
        stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#hw-arrow)" style="animation-delay:.6s"/>

  <rect x="778.5" y="376.5" width="133" height="30" rx="8" fill="#0B1020" stroke="#34D399"/>
  <text class="mono" x="791" y="396" font-size="10.5" fill="#34D399">handbook.md 42&#8211;58</text>
</svg>
