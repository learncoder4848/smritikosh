<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Recorded session cost in US dollars for three paired benchmark tasks. Production triage cost 0.381 dollars with Smritikosh against 1.634 with direct exploration, interest computation 0.230 against 0.330, and architecture discovery 0.361 against 1.259. Lower is better.">
  <title>Recorded session cost by benchmark task, Smritikosh against direct exploration</title>

  <defs>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cap{font-size:10px;letter-spacing:.2em;font-weight:700}
      .ink{fill:#E6EAF2}
      .mut{fill:#9AA4BA}
      .faint{fill:#77839C}

      .bar { transform-box:fill-box; transform-origin:bottom;
             animation: bk-grow 1.1s cubic-bezier(.2,.7,.3,1) both; }
      @keyframes bk-grow { from { transform:scaleY(0) } to { transform:scaleY(1) } }

      .val { animation: bk-in .5s ease-out .7s both; }
      @keyframes bk-in { from { opacity:0 } to { opacity:1 } }

      @media (prefers-reduced-motion: reduce) {
        .bar,.val { animation:none; transform:none; opacity:1 }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="329" rx="18" fill="#0B1020" stroke="#26304A"/>

  <text class="mono cap" x="32" y="32" fill="#9AA4BA">WHAT A SESSION COST</text>
  <text class="sans ink" x="32" y="62" font-size="14.5">Same question, same model. Reading three snippets is cheaper than reading the repo.</text>

  <rect x="652" y="24" width="11" height="11" rx="3" fill="#4C8DFF"/>
  <text class="sans mut" x="670" y="33" font-size="11">Smritikosh</text>
  <rect x="762" y="24" width="11" height="11" rx="3" fill="#5A6784"/>
  <text class="sans mut" x="780" y="33" font-size="11">reading it directly</text>

  <text class="sans faint" x="30" y="196" font-size="10.5" transform="rotate(-90 30 196)" text-anchor="middle">recorded cost (USD)</text>

  <g stroke="#232D48" stroke-width="1">
    <line x1="110" y1="262" x2="928" y2="262"/>
    <line x1="110" y1="213" x2="928" y2="213"/>
    <line x1="110" y1="164" x2="928" y2="164"/>
    <line x1="110" y1="115" x2="928" y2="115"/>
  </g>
  <g class="mono faint" font-size="10" text-anchor="end">
    <text x="100" y="266">$0.00</text>
    <text x="100" y="217">$0.50</text>
    <text x="100" y="168">$1.00</text>
    <text x="100" y="119">$1.50</text>
  </g>
  <g stroke="#39435F" stroke-width="1.5">
    <line x1="110" y1="96" x2="110" y2="262"/>
    <line x1="110" y1="262" x2="928" y2="262"/>
  </g>

  <rect class="bar" x="173" y="224.8" width="64" height="37.2" rx="3" fill="#4C8DFF"/>
  <rect class="bar" x="253" y="102.5" width="64" height="159.5" rx="3" fill="#5A6784" style="animation-delay:.12s"/>
  <text class="mono ink val" x="205" y="216" font-size="10.5" text-anchor="middle">$0.381</text>
  <text class="mono ink val" x="285" y="94" font-size="10.5" text-anchor="middle" style="animation-delay:.8s">$1.634</text>
  <text class="sans ink" x="245" y="284" font-size="11.5" text-anchor="middle">production triage</text>
  <text class="sans mut" x="245" y="300" font-size="10" text-anchor="middle">5 services &#183; 76.7% lower</text>

  <rect class="bar" x="443" y="239.6" width="64" height="22.4" rx="3" fill="#4C8DFF" style="animation-delay:.24s"/>
  <rect class="bar" x="523" y="229.8" width="64" height="32.2" rx="3" fill="#5A6784" style="animation-delay:.36s"/>
  <text class="mono ink val" x="475" y="231" font-size="10.5" text-anchor="middle" style="animation-delay:.85s">$0.230</text>
  <text class="mono ink val" x="555" y="221" font-size="10.5" text-anchor="middle" style="animation-delay:.9s">$0.330</text>
  <text class="sans ink" x="515" y="284" font-size="11.5" text-anchor="middle">interest computation</text>
  <text class="sans mut" x="515" y="300" font-size="10" text-anchor="middle">single repo &#183; 30.4% lower</text>

  <rect class="bar" x="713" y="226.8" width="64" height="35.2" rx="3" fill="#4C8DFF" style="animation-delay:.48s"/>
  <rect class="bar" x="793" y="139.1" width="64" height="122.9" rx="3" fill="#5A6784" style="animation-delay:.6s"/>
  <text class="mono ink val" x="745" y="218" font-size="10.5" text-anchor="middle" style="animation-delay:.95s">$0.361</text>
  <text class="mono ink val" x="825" y="131" font-size="10.5" text-anchor="middle" style="animation-delay:1s">$1.259</text>
  <text class="sans ink" x="785" y="284" font-size="11.5" text-anchor="middle">architecture discovery</text>
  <text class="sans mut" x="785" y="300" font-size="10" text-anchor="middle">curated docs &#183; 71.3% lower</text>

  <text class="sans faint" x="519" y="320" font-size="10" text-anchor="middle">Exported agent sessions, 16&#8211;17 Sep 2026 &#183; paired single runs, not controlled trials</text>
</svg>
