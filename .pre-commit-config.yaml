repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the pinned ruff in pyproject.toml's dev group.
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest (smritikosh)
        language: system
        entry: .venv/bin/python -m pytest --cov=smritikosh --cov-fail-under=75 -q
        pass_filenames: false
        always_run: true
