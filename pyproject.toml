[project]
name = "smritikosh"
version = "0.1.0"
description = "Codebase indexing and hybrid retrieval for agent tool calls"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
]

[project.scripts]
smritikosh = "smritikosh.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smritikosh*"]
