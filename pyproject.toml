[project]
name = "smritikosh"
version = "0.1.0"
description = "Semantic vector search over a codebase"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
]

[project.scripts]
smritikosh = "smritikosh.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smritikosh*"]

[[tool.poetry.source]]
name = "private-pypi"
url = "https://artifact.intuit.com/artifactory/api/pypi/pypi-intuit/simple"
priority = "primary"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.0"
pytest-cov = "^6.0"
ruff = "^0.16.6"
pre-commit = "^4.6.2"
duckdb = "^1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"

[tool.coverage.run]
source = ["smritikosh"]

[tool.coverage.report]
# Baseline: 63 % (engine fully tested; cli/indexing/models stubs not yet implemented).
# Raise this threshold in the same PR that adds tests for each new module.
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
