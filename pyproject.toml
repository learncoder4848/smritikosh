[project]
name = "smritikosh"
version = "0.1.0"
description = "Semantic vector search over a codebase"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
]

[project.scripts]
smritikosh = "smritikosh.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smritikosh*"]

[[tool.poetry.source]]
name = "private-pypi"
url = "https://artifact.intuit.com/artifactory/api/pypi/pypi-intuit/simple"
priority = "primary"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
ruff = "^0.16.6"
pre-commit = "^4.6.2"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
