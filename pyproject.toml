[project]
name = "smritikosh"
version = "0.1.0"
description = "Semantic vector search over a codebase"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "duckdb>=0.10",
    # 1.0 renamed the gitignore pattern factory; "gitwildmatch" is deprecated.
    "pathspec>=1.0",
    "sentence-transformers>=6.0",
    "tree-sitter>=0.25",
    # Pinned below 1.0: the 1.x line downloads grammar binaries at first use
    # into a user cache. 0.x bundles all grammars in the wheel, so an install
    # is deterministic, offline-safe, and covered by the lock file.
    "tree-sitter-language-pack>=0.13,<1.0",
    "truststore>=0.9",
]

[project.scripts]
smritikosh = "smritikosh.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smritikosh*"]

# The per-language directories under queries/ are plain data directories, not
# packages, so packages.find does not reach them and the .scm files ship only
# because of this glob. `make check-wheel` guards it.
[tool.setuptools.package-data]
"smritikosh.queries" = ["**/*.scm"]

[[tool.poetry.source]]
name = "private-pypi"
url = "https://artifact.intuit.com/artifactory/api/pypi/pypi-intuit/simple"
priority = "primary"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.0"
pytest-cov = "^6.0"
ruff = "^0.16.6"
pre-commit = "^4.6.2"
duckdb = "^1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# importlib mode lets test files share a basename across directories.
addopts = "-v --import-mode=importlib"
markers = ["slow: loads the real embedding model; skip with -m 'not slow'"]

[tool.coverage.run]
source = ["smritikosh"]

[tool.coverage.report]
# Baseline: 73 % (engine, strategies, and file selection tested; cli/parser/
# chunker/pipeline stubs not yet implemented).
# Raise this threshold in the same PR that adds tests for each new module.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
